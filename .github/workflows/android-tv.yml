name: App para Android TV

on:
  push:
    branches: [main]
    paths: ['android/**', 'bolas/**', 'aventura/**', 'index.html', '.github/workflows/android-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copiar los juegos dentro de la app (para jugar sin internet)
        run: |
          mkdir -p android/app/src/main/assets/site/bolas android/app/src/main/assets/site/aventura
          cp index.html android/app/src/main/assets/site/index.html
          cp bolas/index.html android/app/src/main/assets/site/bolas/index.html
          cp aventura/index.html android/app/src/main/assets/site/aventura/index.html

      - name: Compilar la app
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk collar-de-colores.apk

      - name: Publicar para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: Juegos de casa para Android TV
          body: Abre https://sactre.github.io/juegos/apk en la tele para descargarla e instalarla.
          files: collar-de-colores.apk
          make_latest: true
