const cv=document.getElementById('c'); const ctx=cv.getContext('2d');
let scale=1, offX=0, offY=0, dpr=1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio||1);
  if (LOWPOWER) dpr = Math.min(1, 1280/Math.max(1,innerWidth));
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  scale=Math.min(innerWidth/W, innerHeight/H);
  offX=(innerWidth-W*scale)/2; offY=(innerHeight-H*scale)/2;
}
addEventListener('resize', resize); resize();

function audio(){

  if (AC && AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;

function tone(f, d, type='sine', vol=0.15, delay=0, slide=0){
  const a=AC; if(!a || a.state!=='running') return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide), t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+0.02);
}

function readGamepads(){
  let pads=[]; try{ pads=navigator.getGamepads?[...navigator.getGamepads()]:[]; }catch(e){}
  pads=pads.filter(p=>p && p.connected!==false).sort((a,b)=>a.index-b.index);
  for (let s=0;s<2;s++){
    const g=SRC[s].gp, p=pads[s];
    if (!p){ Object.assign(g, mkSrc()); continue; }
    const b=i=>p.buttons[i]&&p.buttons[i].pressed?1:0;
    g.ax=p.axes[0]||0; g.ay=p.axes[1]||0;
    g.l=b(14); g.r=b(15); g.u=b(12); g.d=b(13);
    g.a=b(0)|b(5)|b(7); g.x=b(2)|b(4)|b(6); g.b=b(1); g.y=b(3); g.start=b(9);
  }
}
function updateInput(){
  readGamepads();
  for (let s=0;s<2;s++){
    const I=IN[s], S=SRC[s];
    let x=0,y=0,a=0,xx=0,bb=0,yy=0,st=0,l=0,r=0,u=0,d=0;
    for (const src of [S.kb,S.app,S.gp]){
      let ax=src.ax, ay=src.ay; const m=Math.hypot(ax,ay);
      if (m<0.3){ ax=0; ay=0; } else { const k=Math.min(1,(m-0.3)/0.6)/m; ax*=k; ay*=k; }
      x+=ax+(src.r-src.l); y+=ay+(src.d-src.u);
      // una pulsación muy corta (bajar y subir en el mismo instante) también cuenta
      a|=src.a|(src._a||0); xx|=src.x|(src._x||0); bb|=src.b|(src._b||0); yy|=src.y|(src._y||0); st|=src.start|(src._start||0);
      l|=src.l||src._l||src.ax<-0.6; r|=src.r||src._r||src.ax>0.6; u|=src.u||src._u||src.ay<-0.6; d|=src.d||src._d||src.ay>0.6;
      src._a=src._x=src._b=src._y=src._start=src._l=src._r=src._u=src._d=0;
    }
    const m=Math.hypot(x,y); if (m>1){ x/=m; y/=m; }
    I.aP = a && !I.a; I.xP = xx && !I.xb; I.bP = bb && !I.b; I.sP = st && !I.start;
    I.lP = l && !I.l; I.rP = r && !I.r; I.uP = u && !I.u; I.dP = d && !I.d;
    I.x=x; I.y=y; I.a=!!a; I.xb=!!xx; I.b=!!bb; I.hold=!!yy; I.start=!!st; I.l=!!l; I.r=!!r; I.u=!!u; I.d=!!d;
    I.any = I.aP||I.xP||I.lP||I.rP||I.uP||I.dP||I.sP;
    if (I.any) I.seen=true;
  }
}

    }
  }
  return hit;
}

function burst(x,y,colors,n=14,sp=200,life=0.8,size=5){
  if (parts.length>260) parts.splice(0, parts.length-200);
  for (let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rand(sp*.3,sp);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life,max:life,c:colors[i%colors.length],s:rand(size*.6,size*1.3),star:Math.random()<.3}); }
}
const RAINBOW=['#ff5a5a','#ffa53a','#ffe14a','#5ad66a','#4aa8ff','#a06bff'];
const FLOWER_C=['#ff6fa8','#ffd23f','#ff8a3d','#c77dff','#5ec8ff','#ff5e5e'];
const KEY_C={k:['#ffd23f','#b8860b'], j:['#ff7ad0','#b0307e']};

function hint(x,y,who){ if (!hintBubbles.some(b=>b.who===who && b.t>0)) hintBubbles.push({x,y,who,t:2.2}); }
function talk(t,d=3.5){ speech={text:t,t:d}; say(t); }

// ---------------------------------------------------------------- piedras
function rockAt(c,r){ return rocks.find(k=>c>=k.c && c<k.c+k.w && r>=k.r && r<k.r+k.w); }
function rockTiles(k){ const a=[]; for (let dy=0;dy<k.w;dy++) for (let dx=0;dx<k.w;dx++) a.push([k.c+dx,k.r+dy]); return a; }
const ROCK_FLOOR=new Set(['.','b','f','P','Q','x','o','i','>','<','^',',']);
const ROCK_WATER=new Set(['~','=']);
function playerOnTile(c,r){ return players.some(q=>Math.abs(q.x-cx(c))<TS/2+18 && Math.abs(q.y-cy(r))<TS/2+18); }
function stepRock(k,dc,dr){
  const old=rockTiles(k);
  const lead=old.map(([c,r])=>[c+dc,r+dr]).filter(([c,r])=>!(c>=k.c&&c<k.c+k.w&&r>=k.r&&r<k.r+k.w));
  if (lead.some(([c,r])=>playerOnTile(c,r))) return null;
  const chs=lead.map(([c,r])=>tile(c,r));
  const clearOld=()=>{ for (const [c,r] of old){ const key=c+','+r; setTile(c,r, underMap[key]||'.'); delete underMap[key]; } };
  if (chs.every(t=>ROCK_FLOOR.has(t))){
    clearOld(); k.c+=dc; k.r+=dr;
    for (const [c,r] of rockTiles(k)){ underMap[c+','+r]=tile(c,r); setTile(c,r, k.w===2?'M':'R'); }
    return 'move';
  }
  if (chs.every(t=>ROCK_WATER.has(t))){
    clearOld();
    for (const [c,r] of lead){ setTile(c,r,'f'); burst(cx(c),cy(r),['#bfe6ff','#ffffff','#6cc4ff'],18,220,.7,5); }
    bridgeSpots=bridgeSpots.filter(s=>!lead.some(([c,r])=>s.c===c&&s.r===r));
    waterTiles=waterTiles.filter(s=>!lead.some(([c,r])=>s.c===c&&s.r===r));
    rocks.splice(rocks.indexOf(k),1);
    return 'sink';
  }
  return null;
}
const onIce = k => rockTiles(k).every(([c,r])=>underMap[c+','+r]==='i');
function snapshot(){
  undoStack.push({ grid:grid.map(r=>r.slice()), rocks:rocks.map(k=>({c:k.c,r:k.r,w:k.w,ox:0,oy:0})), under:{...underMap},
    bridge:bridgeSpots.map(s=>({...s})), water:waterTiles.map(s=>({...s})), paint:paintLeft, gatesOpen, gates:gates.map(g=>g.open),
    pos:players.map(p=>({x:p.x,y:p.y,key:p.key})), keys:keys.map(k=>k.got), sw:swState });
  if (undoStack.length>60) undoStack.shift();
}
function undo(){
  const s=undoStack.pop();
  if (!s){ SFX.hurt(); return; }
  grid=s.grid; rocks=s.rocks; underMap=s.under; bridgeSpots=s.bridge; waterTiles=s.water; paintLeft=s.paint; gatesOpen=s.gatesOpen;
  gates.forEach((g,i)=>g.open=s.gates[i]);
  keys.forEach((k,i)=>k.got=s.keys[i]); swState=s.sw; pendingDown=new Set();
  players.forEach((p,i)=>{ if (s.pos[i]){ p.x=s.pos[i].x; p.y=s.pos[i].y; p.key=s.pos[i].key; p.kx=p.ky=0; p.tpLock=null; } });
  staticDirty=true; SFX.undo();
  for (const p of players) burst(p.x,p.y-30,['#ffffff','#bfe6ff'],10,150,.5,4);
}
function tryPush(k, dc, dr){
  snapshot();
  let steps=0, res, dir=[dc,dr], mx=0, my=0;
  while (steps<30){
    res=stepRock(k,dir[0],dir[1]); if (!res) break;
    steps++; mx+=dir[0]; my+=dir[1];
    if (res!=='move') break;
    const u = k.w===1 ? underMap[k.c+','+k.r] : null;
    if (u && ARROW_DIR[u]) dir=ARROW_DIR[u];       // las flechas llevan la piedra
    else if (!onIce(k)) break;                     // en el hielo resbala
  }
  if (!steps){ undoStack.pop(); return false; }
  idleT=0;
  if (res==='sink' || !rocks.includes(k)) SFX.splash();
  else {
    k.ox=-mx*TS; k.oy=-my*TS; SFX.push();
    if (steps>1) SFX.slide();
    burst(cx(k.c)-dir[0]*TS/2, cy(k.r)-dir[1]*TS/2, ['#c9b38a','#a8916a'], 6, 80, .4, 4);
  }
  return true;
}
function tryPaint(p){
  let best=null, bd=1e9;
  for (const s of bridgeSpots){ const d=Math.hypot(cx(s.c)-p.x, cy(s.r)-p.y); if (d<bd){ bd=d; best=s; } }
  if (!best || bd>TS*1.6) return false;
  if (paintLeft<=0){ SFX.hurt(); talk('¡No queda pintura!',2.5); return true; }
  snapshot();
  const q=[best], seen=new Set();
  while (q.length){ const s=q.pop(), k=s.c+','+s.r; if (seen.has(k)) continue; seen.add(k);
    setTile(s.c,s.r,'b'); burst(cx(s.c),cy(s.r),RAINBOW,16,180,.9,5);
    for (const o of bridgeSpots) if (Math.abs(o.c-s.c)+Math.abs(o.r-s.r)===1) q.push(o); }
  bridgeSpots=bridgeSpots.filter(s=>!seen.has(s.c+','+s.r));
  waterTiles=waterTiles.filter(s=>!seen.has(s.c+','+s.r));
  paintLeft--; idleT=0;
  SFX.paint(); return true;
}
// ---------------------------------------------------------------- cosas nuevas: cristales, paredes agrietadas, llaves
function toggleSwitch(sw){
  if (sw.cd>0) return;
  sw.cd=0.6; sw.flash=0.5; snapshot(); swState^=1; idleT=0;
  // si un niño está encima de una barrera que sube, espera a que se aparte
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){ const ch=grid[r][c];
    if ((ch==='['||ch===']') && playerOnTile(c,r)) pendingDown.add(c+','+r); }
  SFX.toggle(); burst(cx(sw.c),cy(sw.r)-10,['#7ef0ff','#ffffff','#d48cff'],18,200,.7,5);
}
function breakWall(c,r){
  setTile(c,r,'.'); SFX.crack(); idleT=0;
  burst(cx(c),cy(r),['#a3a6ad','#7b7d84','#cfd2d6','#c9b38a'],22,260,.8,7);
}
function openLock(p,c,r){
  snapshot();
  setTile(c,r,'.'); p.key=null; SFX.open(); idleT=0;
  burst(cx(c),cy(r),KEY_C[tile(c,r)==='J'?'j':'k'].concat(['#ffffff']),22,240,.8,6);
}

function action(p, btn){
  if (p.cd>0) return;
  if (btn==='a' && tryPaint(p)){ p.cd=0.4; return; }
  if (!p.magic && !p.golpe) return;
  const kind = btn==='a' ? (p.magic?'magic':'golpe') : (p.golpe?'golpe':'magic');
  if (p.ammo<=0){ p.cd=0.25; SFX.empty(); return; }
  p.ammo--;
  if (kind==='magic'){
    const m=Math.hypot(p.fx,p.fy)||1;
    bolts.push({who:p.who, x:p.x+p.fx/m*24, y:p.y-18+p.fy/m*24, vx:p.fx/m*620, vy:p.fy/m*620, life:0.6});
    p.cd=0.28; SFX.bolt();
  } else {
    waves.push({who:p.who, x:p.x, y:p.y-10, ox:p.x, oy:p.y, r:20, life:0.35, max:0.35, hit:new Set()});
    p.cd=0.55; p.bonk=0.3; p.swing=0.3;
    if (p.who==='diego') SFX.roar(); else SFX.hammer();
  }
}
function cloudToFlower(c){
  flowers.push({x:c.x,y:c.y+10,c:FLOWER_C[(Math.random()*FLOWER_C.length)|0],ph:Math.random()*6,grow:0});
  burst(c.x,c.y,['#ffffff','#ffd6f0','#fff27a'],16,200,.7,5); SFX.flower();
  if (Math.random()<0.25) items.push({type:'heart',x:c.x,y:c.y,ph:0});
}
function hurt(p, fromX, fromY){
  if (p.inv>0 || p.bubble) return;
  p.hearts--; p.inv=1.8; SFX.hurt();
  const a=Math.atan2(p.y-fromY, p.x-fromX); p.kx=Math.cos(a)*420; p.ky=Math.sin(a)*420;
  burst(p.x,p.y-30,['#ffffff','#ff9aa8'],8,150,.5,4);
  if (p.hearts<=0){
    p.bubble=true; p.hearts=0; SFX.bubble();
    const o=players.find(q=>q!==p && !q.bubble);
    if (o) talk(`¡${NAMES[o.who]}, rescata a ${NAMES[p.who]}!`,4);
  }
}

// ---------------------------------------------------------------- update
function update(dt){
  updateInput();
  musicTick();
  stateT+=dt;
  for (const pt of parts){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vx*=0.94; pt.vy*=0.94; pt.life-=dt; }
  parts=parts.filter(pt=>pt.life>0);

  if (state==='title') return updateTitle(dt);
  if (state==='map') return updateMap(dt);
  if (state==='story'){ if (IN.some(I=>I.aP) && stateT>0.5){ storyPage++; stateT=0; if (storyPage>=STORY.length){ prog.story=true; saveProg(); levelIdx=0; startTrain(); } else say(tpl(STORY[storyPage])); } return; }
  if (state==='train'){ if (stateT>3.6 || (stateT>1.2 && IN.some(I=>I.aP))){ state='play'; stateT=0; loadLevel(levelIdx); } return; }
  if (state==='pause'){ if (IN.some(I=>I.aP||I.sP)){ state='play'; } if (IN.some(I=>I.bP)){ goMap(); } return; }
  if (state==='clear'){
    if (stateT>3.2){
      if (L.boss){ state='end'; stateT=0; SFX.win(); say(`¡Gracias, ${NAMES.diego} y ${NAMES.sofia}! Las estrellas vuelven a brillar.`); }
      else goMap();
    }
    updatePlay(dt,true); return; }
  if (state==='end'){ if (stateT>4 && IN.some(I=>I.aP)) goMap(); if (Math.random()<dt*3) burst(rand(100,1180),rand(80,400),RAINBOW,24,260,1.2,5); return; }
  if (state==='play') updatePlay(dt,false);
}

function updateTitle(dt){
  for (let s=0;s<2;s++){ if (IN[s].any) active[s]=true; }
  if (IN.some(I=>I.lP||I.rP)){ charOf=[charOf[1],charOf[0]]; SFX.pop(); }
  if (stateT>0.6 && IN.some(I=>I.aP)){
    audio();
    if (!active[0]&&!active[1]) active[0]=true;
    if (!prog.story && prog.max===1){ state='story'; storyPage=0; stateT=0; say(tpl(STORY[0])); }
    else goMap();
  }
}
const STORY=[
  'Una noche, las nubes gruñonas se llevaron todas las estrellas del cielo.',
  'Soy Tito, el dinosaurio. ¿Me ayudáis a recuperarlas, {D} y {S}?',
];
function startTrain(){ state='train'; stateT=0; say(LEVELS[levelIdx].name); }

// ---------------------------------------------------------------- mapa
const WORLDS=['La pradera','La montaña de hielo','El templo','El valle de los colores','El castillo de las nubes'];
const MAP_ORDER=[]; for (let w=0;w<5;w++){ for (let j=0;j<6;j++) MAP_ORDER.push(w*6+j); MAP_ORDER.push(MAIN+w); }
const unlocked = i => i<MAIN ? i<prog.max : prog.gold.includes(i-MAIN);
const finished = i => i<MAIN ? i<prog.max-1 || (i===MAIN-1 && prog.won) : prog.done.includes(i-MAIN);
function mapPos(i){
  if (i>=MAIN) return { x:1172, y:134+(i-MAIN)*106 };
  const w=Math.floor(i/6), j=i%6;
  return { x:160+j*168, y:134+w*106 };
}
function goMap(){
  state='map'; stateT=0; speech=null;
  if (!unlocked(mapSel)) mapSel=prog.max-1;
  try{ speechSynthesis.cancel(); }catch(e){}
}
function updateMap(dt){
  for (let s=0;s<2;s++){ if (IN[s].any) active[s]=true; }
  const k=MAP_ORDER.indexOf(mapSel);
  const move=(d)=>{ let j=k; do { j+=d; } while (j>=0 && j<MAP_ORDER.length && !unlocked(MAP_ORDER[j])); if (j>=0 && j<MAP_ORDER.length){ mapSel=MAP_ORDER[j]; SFX.star(); } };
  if (IN.some(I=>I.rP)) move(1);
  if (IN.some(I=>I.lP)) move(-1);
  if (IN.some(I=>I.dP||I.uP)){
    const d=IN.some(I=>I.dP)?1:-1, w=worldOf(mapSel)+d, col = mapSel<MAIN ? mapSel%6 : 6;
    if (w>=0 && w<5){ let t = col<6 ? w*6+col : MAIN+w; if (!unlocked(t)) t = w*6+Math.min(5,col); while (t>w*6 && !unlocked(t)) t--; if (unlocked(t)){ mapSel=t; SFX.star(); } }
  }
  if (stateT>0.5 && IN.some(I=>I.bP||I.sP)){ state='title'; stateT=0; return; }
  if (stateT>0.5 && IN.some(I=>I.aP)){
    if (!active[0]&&!active[1]) active[0]=true;
    levelIdx=mapSel; startTrain();
  }
}

function updateAmbient(dt){
  const kind = {pradera:'mariposa',pintura:'petalo',bosque:'luciernaga',rio:'mariposa',charcos:'mariposa',nieve:'nieve',hielo:'nieve',cueva:'brillo',templo:'hoja',castillo:'estrellita',secreto:'estrellita'}[L.theme];
  const max = LOWPOWER ? 12 : 24;
  if (ambient.length<max && Math.random()<dt*6){
    const a={kind, x:rand(0,W), y:rand(TOP,H), vx:rand(-20,20), vy:rand(-10,10), ph:Math.random()*6, life:rand(5,10), c:FLOWER_C[(Math.random()*6)|0]};
    if (kind==='nieve'||kind==='petalo'||kind==='hoja'){ a.y=TOP-10; a.vy=rand(25,50); }
    if (kind==='brillo'){ a.y=H+5; a.vy=rand(-30,-15); }
    ambient.push(a);
  }
  for (const a of ambient){ a.ph+=dt; a.life-=dt; a.x+=(a.vx+Math.sin(a.ph*1.3)*20)*dt; a.y+=(a.vy+(a.kind==='mariposa'?Math.sin(a.ph*2.2)*25:0))*dt; }
  ambient=ambient.filter(a=>a.life>0 && a.y<H+20 && a.y>TOP-30);
}

function updatePlay(dt, frozen){
  const t=now();
  updateAmbient(dt);
  for (const w of waterTiles) w.ph+=dt;
  if (!frozen) for (let s=0;s<2;s++){
    if (!active[s] && (IN[s].aP||IN[s].xP)){
      active[s]=true; const o=players[0];
      addPlayer(s, o?{x:o.x,y:o.y}:{x:cx(1),y:cy(1)}); SFX.pop();
      const np=players[players.length-1];
      // si se une a mitad del nivel, trae lo que ya tenga su compañero
      if (o){ np.magic=np.magic||o.magic; np.golpe=np.golpe||o.golpe; }
      burst(np.x, np.y-30, RAINBOW, 20, 220, .8, 5);
      IN[s].aP=IN[s].xP=false;   // el botón que le hace entrar no dispara
    }
  }
  if (!frozen && IN.some(I=>I.sP)){ state='pause'; return; }
  // botón Y: pulsar y soltar = deshacer; mantener = empezar de nuevo (B ya no hace nada al jugar, se pulsaba sin querer)
  if (!frozen){
    for (const p of players){ const s=p.slot;
      if (IN[s].hold){ if (!yUsed[s]) yHold[s]+=dt; }
      else { if (yHold[s]>0 && yHold[s]<0.45 && !yUsed[s]) undo(); yHold[s]=0; yUsed[s]=false; }
    }
    restartT=Math.max(yHold[0],yHold[1]);
    if (restartT>1.8){ yHold=[0,0]; yUsed=[true,true]; restartT=0; loadLevel(levelIdx,true); SFX.open(); talk('¡Otra vez desde el principio!',2.5); return; }
  }
  // pista de Tito si llevan rato sin avanzar
  if (!frozen && L.hint){ idleT+=dt; if (idleT>45){ idleT=0; talk(tpl(L.hint),7); } }

  // jugadores
  for (const p of players){
    const I=IN[p.slot];
    p.cd-=dt; p.inv-=dt; p.bonk-=dt; p.swing-=dt;
    if (p.ammo<AMMO_MAX){ p.ammoT+=dt; if (p.ammoT>=AMMO_TIME){ p.ammo++; p.ammoT=0; } } else p.ammoT=0;
    const mx=frozen?0:I.x, my=frozen?0:I.y;
    const sp = p.bubble ? 90 : (p.who==='diego' ? 250 : 240);
    p.moving = Math.hypot(mx,my)>0.15;
    if (p.moving){ p.fx=mx; p.fy=my; if (Math.abs(mx)>0.2) p.face=Math.sign(mx); p.walk+=dt*(p.who==='diego'?14:10); }
    let dx=mx*sp*dt + p.kx*dt, dy=my*sp*dt + p.ky*dt;
    // flechas del suelo: empujan más fuerte de lo que se anda, así solo se pueden cruzar en su sentido
    const under=tile(Math.floor(p.x/TS), Math.floor((p.y-TOP)/TS));
    if (isArrow(under) && !frozen){ const [ax,ay]=ARROW_DIR[under]; dx+=ax*300*dt; dy+=ay*300*dt; }
    p.kx*=Math.pow(0.002,dt); p.ky*=Math.pow(0.002,dt);
    if (p.bubble){ dy+=Math.sin(t*2+p.slot)*12*dt; }
    const hit=moveBox(p, dx, dy, 20, solidForPlayer);
    const ch = hit ? tile(hit.c,hit.r) : '';
    // cerraduras: se abren al tocarlas con la llave de su color
    if (hit && !p.bubble && (ch==='K'||ch==='J')){
      if (p.key===ch.toLowerCase()) openLock(p,hit.c,hit.r);
      else if (p.moving && !p.key){ p.pushT+=dt; if (p.pushT>0.6){ p.pushT=0; const k=keys.find(k=>k.col===ch.toLowerCase() && !k.got); if (k) hint(k.x,k.y-50,p.who); } }
    }
    // empujar rocas (ahora pueden los dos)
    if (hit && !p.bubble && (ch==='R'||ch==='M') && p.moving && ((hit.dc && Math.abs(mx)>0.5) || (hit.dr && Math.abs(my)>0.5))){
      const k=rockAt(hit.c,hit.r);
      const key=rocks.indexOf(k)+','+hit.dc+','+hit.dr;
      if (p.pushDir!==key){ p.pushDir=key; p.pushT=0; }
      p.pushT+=dt; p.pushing={k, dc:hit.dc, dr:hit.dr, t};
      if (k.w===2){
        // la roca gigante: hacen falta los dos empujando hacia el mismo lado
        const awake=players.filter(q=>!q.bubble).length;
        const pushers=players.filter(q=>q.pushing && q.pushing.k===k && q.pushing.dc===hit.dc && q.pushing.dr===hit.dr && t-q.pushing.t<0.2);
        if (p.pushT>0.2 && pushers.length>=Math.min(2,awake)){ tryPush(k,hit.dc,hit.dr); for (const q of pushers) q.pushT=0; }
        else if (p.pushT>0.7 && awake>=2){ const o=players.find(q=>q!==p); hint(cx(k.c)+TS/2, cy(k.r)-70, o.who); }
      } else if (p.pushT>0.16){ tryPush(k,hit.dc,hit.dr); p.pushT=0; }
    } else if (!(ch==='K'||ch==='J')) { p.pushT=0; p.pushDir=null; p.pushing=null; }
    // teletransportes: aparece en el otro del mismo color
    const pc=Math.floor(p.x/TS), pr=Math.floor((p.y-TOP)/TS), pk=pc+','+pr, pch=tile(pc,pr);
    if (p.tpLock && p.tpLock!==pk) p.tpLock=null;
    if (isPad(pch) && !p.tpLock && !frozen && Math.abs(p.x-cx(pc))<22 && Math.abs(p.y-cy(pr))<22){
      const o=pads.find(q=>q.ch===pch && (q.c!==pc || q.r!==pr));
      if (o){ burst(p.x,p.y-20,['#ffffff','#9ff2ff','#ffb3f0'],18,200,.6,5);
        p.x=cx(o.c); p.y=cy(o.r); p.kx=p.ky=0; p.tpLock=o.c+','+o.r; SFX.tele(); idleT=0;
        burst(p.x,p.y-20,['#ffffff','#9ff2ff','#ffb3f0'],18,200,.6,5); }
    }
    if (!frozen && !p.bubble){ if (I.aP) action(p,'a'); else if (I.xP) action(p,'x'); }
  }
  // barreras que esperaban a que se apartara un niño
  for (const k of [...pendingDown]){ const [c,r]=k.split(',').map(Number); if (!playerOnTile(c,r)) pendingDown.delete(k); }
  for (const sw of switches){ sw.cd-=dt; sw.flash-=dt; }
  // rescatar burbujas
  for (const p of players) if (p.bubble){
    for (const q of players) if (q!==p && !q.bubble && Math.hypot(q.x-p.x,q.y-p.y)<62){
      p.bubble=false; p.hearts=3; p.inv=2; SFX.pop(); burst(p.x,p.y-30,['#bfefff','#ffffff','#ffe27a'],24,240,.8,6);
    }
  }
  if (players.length && players.every(p=>p.bubble)){
    bubbleTimer+=dt;
    if (bubbleTimer>2.5){ bubbleTimer=0; for (const p of players){ p.bubble=false; p.hearts=3; p.inv=2; burst(p.x,p.y-30,['#bfefff','#ffffff'],20,220,.8,6);} SFX.pop(); }
  } else bubbleTimer=0;

  for (const k of rocks){ k.ox*=Math.pow(0.0004,dt); k.oy*=Math.pow(0.0004,dt); if (Math.abs(k.ox)<0.5) k.ox=0; if (Math.abs(k.oy)<0.5) k.oy=0; }

  // magia
  for (const b of bolts){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;

    const bc=Math.floor(b.x/TS), br=Math.floor((b.y-TOP)/TS), ch=tile(bc,br);

      else { c.dead=true; cloudToFlower(c); }
    }
    if (boss && boss.hp>0 && b.life>0 && Math.hypot(boss.x-b.x,boss.y-b.y)<boss.r){ b.life=0; if (boss.shield>0){ SFX.clonk(); burst(b.x,b.y,['#c9ccd6','#ffffff'],8,160,.4,4); } else hitBoss(1); }
  }
  bolts=bolts.filter(b=>b.life>0);
  // golpe (rugido de Diego / martillazo de Sofía): rompe paredes agrietadas, quita cascos y mueve cristales
  for (const w of waves){
    w.life-=dt; w.r=20+(1-w.life/w.max)*110;
    for (const c of clouds) if (!c.dead && Math.hypot(c.x-w.x,c.y-w.y)<w.r+20){ c.dead=true; cloudToFlower(c); }
    const reach=Math.min(w.r+12,100);
    const c0=Math.floor(w.ox/TS), r0=Math.floor((w.oy-TOP)/TS);
    for (let r=r0-2;r<=r0+2;r++) for (let c=c0-2;c<=c0+2;c++){
      const ch=tile(c,r), d=Math.hypot(cx(c)-w.ox, cy(r)-w.oy);
      if (d>reach) continue;
      if (ch==='%' && r>0 && r<ROWS-1 && c>0 && c<COLS-1) breakWall(c,r);
      if (ch==='s' && !w.hit.has(c+','+r)){ w.hit.add(c+','+r); const sw=switches.find(s=>s.c===c&&s.r===r); if (sw) toggleSwitch(sw); }
    }
    if (boss && boss.hp>0 && !w.hit.has('boss') && Math.hypot(boss.x-w.x,boss.y-w.y)<w.r+boss.r){ w.hit.add('boss'); if (boss.shield>0){ boss.shield=0; SFX.crack(); burst(boss.x,boss.y,['#c9ccd6','#ffffff'],24,300,.8,7); } hitBoss(2); }
  }
  waves=waves.filter(w=>w.life>0);
  clouds=clouds.filter(c=>!c.dead);

  for (const c of clouds){
    c.ph+=dt; c.t-=dt; if (c.bonk>0) c.bonk-=dt;
    if (c.mode==='n' && c.t<=0){ const a=Math.random()*Math.PI*2, v=rand(50,85); c.vx=Math.cos(a)*v; c.vy=Math.sin(a)*v; c.t=rand(1.5,3); }
    const h=moveBox(c, c.vx*dt, c.vy*dt, 22, solidForCloud);
    if (h){ if (h.dc) c.vx=-c.vx; if (h.dr) c.vy=-c.vy; }
    if (!frozen) for (const p of players) if (Math.hypot(p.x-c.x,(p.y-20)-c.y)<42) hurt(p,c.x,c.y);
  }
  if (boss) updateBoss(dt, frozen);
  for (const it of items){
    it.ph+=dt;
    for (const p of players) if (!p.bubble && !it.got && Math.hypot(p.x-it.x,(p.y-14)-it.y)<44){
      if (it.type==='star'){ it.got=true; starsGot++; idleT=0; SFX.star(); burst(it.x,it.y,['#fff27a','#ffd23f','#ffffff'],16,220,.7,5);
        if (starsGot===starsTotal){ doorOpen=true; staticDirty=true; setTimeout(()=>SFX.open(),250); talk('¡Ya tenéis todas! ¡La puerta está abierta!',4); } }
      else if (it.type==='heart'){ it.got=true; p.hearts=Math.min(5,p.hearts+2); SFX.heart(); burst(it.x,it.y,['#ff6b8a','#ffffff'],12,180,.6,5); }
      else if (it.type==='gold'){ it.got=true; goldGot=true; SFX.gold(); burst(it.x,it.y,['#fff27a','#ffd23f','#ffffff','#ffb020'],40,320,1.2,7);
        const w=worldOf(levelIdx); if (!prog.gold.includes(w)){ prog.gold.push(w); saveProg(); }
        talk('¡Una estrella dorada! Hay un nivel secreto en el mapa.',5); }
      else if (it.type==='potion' || it.type==='hammer'){
        const owner = it.type==='potion' ? 'diego' : 'sofia';
        if (p.who!==owner && !solo()){ hint(it.x,it.y-60,owner); continue; }
        it.got=true; idleT=0; SFX.potion(); burst(it.x,it.y,it.type==='potion'?['#7dff8a','#ffd23f','#ffffff']:['#ff9ae0','#ffd23f','#ffffff'],30,260,1,6);
        if (it.type==='potion'){ p.magic=true; talk(`¡${NAMES[p.who]} se ha bebido la poción! Ahora lanza magia con A.`,5); }
        else { p.golpe=true; talk(`¡${NAMES[p.who]} tiene un martillo! Con X da un golpe que rompe paredes.`,5); }
      }
    }
  }
  items=items.filter(it=>!it.got);
  // llaves: cada niño puede llevar una
  for (const k of keys){ k.ph+=dt; if (k.got) continue;
    for (const p of players) if (!p.bubble && !p.key && Math.hypot(p.x-k.x,(p.y-14)-k.y)<44){ k.got=true; p.key=k.col; SFX.key(); idleT=0; burst(k.x,k.y,KEY_C[k.col].concat(['#ffffff']),16,200,.7,5); break; } }
  if (bigStar){
    bigStar.t+=dt; bigStar.y+= (bigStar.ty-bigStar.y)*Math.min(1,dt*2);
    if (!bigStar.got && bigStar.t>1) for (const p of players) if (!p.bubble && Math.hypot(p.x-bigStar.x,(p.y-20)-bigStar.y)<70){
      bigStar.got=true; SFX.win(); burst(bigStar.x,bigStar.y,['#fff27a','#ffd23f','#ffffff',...RAINBOW],60,400,1.4,7);
      levelDone();
    }
  }
  for (const f of flowers){ f.ph+=dt; f.grow=Math.min(1,f.grow+dt*3); }
  // botones: los pisan los niños o las piedras
  const awake=players.filter(p=>!p.bubble);
  for (const pl of plates) pl.on = tile(pl.c,pl.r)==='R' || tile(pl.c,pl.r)==='M' || (pl.kind!=='Q' && awake.some(p=>Math.floor(p.x/TS)===pl.c && Math.floor((p.y-TOP)/TS)===pl.r));
  const P=plates.filter(p=>p.kind==='P'), Q=plates.filter(p=>p.kind==='Q');
  if ((P.length||Q.length) && !gatesOpen){
    const pressedP=P.filter(p=>p.on).length;
    const okP = !P.length || pressedP >= (awake.length>=2 ? P.length : 1);
    const okQ = Q.every(p=>p.on);
    if (okP && okQ){
      gatesOpen=true; idleT=0;
      for (const g of gates) if (g.kind==='G'){ setTile(g.c,g.r,'.'); burst(cx(g.c),cy(g.r),['#cfefff','#ffffff','#8fd0ff'],20,220,.9,6); }
      SFX.open(); talk('¡Bien hecho! ¡La reja se ha abierto!');
    }
  }
  for (const g of gates) if (g.kind==='G' && gatesOpen) g.open=Math.min(1,g.open+dt*1.5);
  // botones de colores: la puerta está abierta mientras se pisa (si juega uno solo, se queda abierta)
  for (const col of ['x','o']){
    const G=col.toUpperCase();
    const pressed = plates.some(p=>p.kind===col && p.on);

    const occupied = gates.some(g=>g.kind===G && playerOnTile(g.c,g.r));
    const want = pressed || (solo() && colorEver[col]) || (occupied && colorOpen[col]>0.5) ? 1 : 0;
    colorOpen[col] += (want-colorOpen[col])*Math.min(1,dt*8);
    if (want && colorOpen[col]>0.98) colorOpen[col]=1;
    if (!want && colorOpen[col]<0.02) colorOpen[col]=0;
  }
  if (door && doorOpen && !frozen){
    door.anim+=dt;

  for (const hb of hintBubbles) hb.t-=dt; hintBubbles=hintBubbles.filter(h=>h.t>0);

  if (tito) tito.ph+=dt;
}
// el Nubarrón: con la magia pierde 1, con el golpe 2. A mitad suelta nubes con casco y a veces se pone un escudo que solo rompe el golpe
function updateBoss(dt, frozen){
  boss.ph+=dt; boss.flash-=dt;
  if (boss.hp<=0) return;
  const phase = boss.hp>13 ? 1 : boss.hp>6 ? 2 : 3;
  const sp = phase===1 ? 1 : phase===2 ? 1.2 : 1.35;
  boss.x+=boss.vx*dt*sp; boss.y+=boss.vy*dt*sp;
  if (boss.x<TS+boss.r){ boss.x=TS+boss.r; boss.vx=Math.abs(boss.vx); }
  if (boss.x>W-TS-boss.r){ boss.x=W-TS-boss.r; boss.vx=-Math.abs(boss.vx); }
  if (boss.y<TOP+TS+boss.r-20){ boss.y=TOP+TS+boss.r-20; boss.vy=Math.abs(boss.vy); }
  if (boss.y>TOP+9*TS-boss.r){ boss.y=TOP+9*TS-boss.r; boss.vy=-Math.abs(boss.vy); }
  if (frozen) return;
  boss.spawn-=dt;
  if (boss.spawn<=0){
    boss.spawn=phase===1?4.5:3.8;
    if (clouds.length<(phase===1?3:4)){ const a=Math.random()*Math.PI*2; clouds.push({x:boss.x,y:boss.y+40,mode:'n',helmet:phase>1&&Math.random()<0.5,vx:Math.cos(a)*80,vy:Math.sin(a)*80,t:2,ph:0}); SFX.boss(); }
  }
  if (phase===3){
    if (boss.shield>0) boss.shield-=dt;
    else { boss.shieldT-=dt; if (boss.shieldT<=0){ boss.shieldT=7; boss.shield=4; SFX.boss(); talk('¡Tiene escudo! ¡Dadle un golpe con X!',3); } }
  }
  for (const p of players) if (Math.hypot(p.x-boss.x,(p.y-20)-boss.y)<boss.r+12) hurt(p,boss.x,boss.y);
}
function hitBoss(n){
  boss.hp=Math.max(0,boss.hp-n); boss.flash=0.25; SFX.boss();
  burst(boss.x+rand(-30,30),boss.y+rand(-30,30),['#ffffff','#ffd6f0'],10,200,.5,5);
  if (boss.hp<=0){
    boss.hp=0; boss.shield=0; clouds.forEach(c=>{ c.dead=true; cloudToFlower(c); }); clouds=[];
    burst(boss.x,boss.y,RAINBOW,60,420,1.4,7); SFX.open();
    bigStar={x:boss.x,y:boss.y,ty:Math.min(boss.y,TOP+6*TS),t:0};
    talk('¡Lo habéis conseguido! ¡Coged la gran estrella!',4);
  }
}
function levelDone(){
  state='clear'; stateT=0; SFX.win();
  const msgs=['¡Genial!','¡Qué buen equipo!','¡Lo habéis conseguido!','¡Muy bien!'];
  say(msgs[(Math.random()*msgs.length)|0]);
  if (levelIdx<MAIN){
    if (levelIdx+2>prog.max) prog.max=Math.min(MAIN, levelIdx+2);
    if (levelIdx===MAIN-1) prog.won=true;
    mapSel=Math.min(MAIN-1, levelIdx+1);
  } else { const w=levelIdx-MAIN; if (!prog.done.includes(w)) prog.done.push(w); mapSel=levelIdx; }
  saveProg();
  for (const p of players) burst(p.x,p.y-30,RAINBOW,20,260,1,6);
}

function star(g,x,y,r,rot=0,fill='#ffd93b',stroke='#e8a200',lw=3){
  g.beginPath();
  for (let i=0;i<10;i++){ const a=rot-Math.PI/2+i*Math.PI/5, rr=i%2?r*0.45:r; g.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  g.closePath(); if (fill){ g.fillStyle=fill; g.fill(); } if (stroke){ g.strokeStyle=stroke; g.lineWidth=lw; g.lineJoin='round'; g.stroke(); }
}
function heart(g,x,y,s,fill='#ff4d6d',stroke='#b3123a'){
  g.beginPath(); g.moveTo(x,y+s*0.35);
  g.bezierCurveTo(x-s*1.1,y-s*0.35,x-s*0.5,y-s*1.05,x,y-s*0.45);
  g.bezierCurveTo(x+s*0.5,y-s*1.05,x+s*1.1,y-s*0.35,x,y+s*0.35);
  g.closePath(); g.fillStyle=fill; g.fill(); if (stroke){ g.strokeStyle=stroke; g.lineWidth=2.5; g.stroke(); }
}
function circle(g,x,y,r,fill){ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fillStyle=fill; g.fill(); }
function ellipse(g,x,y,rx,ry,fill){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fillStyle=fill; g.fill(); }
function rrect(g,x,y,w,h,r,fill){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); if(fill){ g.fillStyle=fill; g.fill(); } }

function shade(hex, f){   // aclara (f>0) u oscurece (f<0) un color

const isWater = ch => ch==='~'||ch==='=';
function renderStatic(){
  if (!staticLayer){ staticLayer=document.createElement('canvas'); }
  const q = LOWPOWER ? 1 : 1.5;
  staticLayer.width=Math.round(W*q); staticLayer.height=Math.round((H-TOP)*q);

  // suelo

    const x=c*TS, y=TOP+r*TS;
    g.fillStyle = hsh(c,r,7)<.5 ? theme.g1 : theme.g2; g.fillRect(x,y,TS,TS);
    floorDetail(g,x,y,c,r);
  }
  // hielo

    g.strokeStyle='rgba(120,180,225,.5)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,TS-1,TS-1);
  }
  // agua, puentes y piedras hundidas
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const x=c*TS, y=TOP+r*TS, ch=grid[r][c];
    if (!(isWater(ch)||ch==='b'||ch==='f')) continue;

    g.fillStyle=theme.water; g.fillRect(x,y+6,TS,TS-6);
    const wet = (cc,rr)=>{ const t=tile(cc,rr); return isWater(t)||t==='b'||t==='f'; };
    // sombra de la orilla de arriba y espuma en los bordes
    if (!wet(c,r-1)){ g.fillStyle='rgba(0,0,0,.18)'; g.fillRect(x,y,TS,8); }
    g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=4; g.lineCap='round';
    if (!wet(c-1,r)){ g.beginPath(); g.moveTo(x+2,y+6); g.lineTo(x+2,y+TS-4); g.stroke(); }
    if (!wet(c+1,r)){ g.beginPath(); g.moveTo(x+TS-2,y+6); g.lineTo(x+TS-2,y+TS-4); g.stroke(); }
    if (!wet(c,r+1)){ g.beginPath(); g.moveTo(x+4,y+TS-2); g.lineTo(x+TS-4,y+TS-2); g.stroke(); }
    g.strokeStyle='rgba(255,255,255,.35)'; g.lineWidth=3;
    for (let k=0;k<2;k++){ const yy=y+20+k*24+((c+r)%2)*5; g.beginPath(); g.moveTo(x+10,yy); g.quadraticCurveTo(x+20,yy-5,x+30,yy); g.quadraticCurveTo(x+40,yy+5,x+50,yy); g.stroke(); }
    if (ch==='b'){

      g.fillStyle='rgba(255,255,255,.28)'; for (let k=0;k<4;k++) g.fillRect(x+5+k*16,y+5,3,54);
      g.fillStyle='rgba(0,0,0,.15)'; g.fillRect(x,y+59,TS,4);
    }
    if (ch==='f'){ ellipse(g,x+32,y+40,27,18,'#6d6f75'); ellipse(g,x+31,y+33,24,16,'#9fa2a9'); ellipse(g,x+24,y+28,8,4,'#c4c7cc'); }

  }
  // sombras de las paredes sobre el suelo
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    if (grid[r][c]!=='#') continue;
    const x=c*TS, y=TOP+r*TS;

function drawPlay(t){

  for (const sw of switches) list.push({y:cy(sw.r)+20, d:()=>drawSwitch(g,sw,t)});
  for (const c of clouds) list.push({y:c.y+20, d:()=>drawCloud(g,c.x,c.y,1,c.ph,'#8f95aa',true,c.bonk>0,c.helmet)});
  if (tito) list.push({y:tito.y+20, d:()=>drawTito(g,tito.x,tito.y,tito.ph)});
  for (const p of players) list.push({y:p.y+18, d:()=>drawPlayer(g,p,t)});
  if (boss) list.push({y:boss.y+boss.r, d:()=>{ if (boss.hp>0){ drawCloud(g,boss.x,boss.y,3.2,boss.ph,'#62667e',true,boss.flash>0);

  drawParts(g);
  drawAmbient(g,t);
  g.drawImage(getVignette(), 0, TOP, W, H-TOP);
  for (const hb of hintBubbles){ const a=Math.min(1,hb.t*2); g.globalAlpha=a;
    circle(g,hb.x,hb.y,34,'rgba(255,255,255,.95)'); g.strokeStyle=COLORS[hb.who]; g.lineWidth=4; g.stroke(); drawFace(g,hb.who,hb.x,hb.y+4,1.2); g.globalAlpha=1; }
  drawHUD(g,t);
  if (restartT>0.45){ const k=Math.min(1,(restartT-0.45)/1.35), x=W/2, y=TOP+70;
    circle(g,x,y,40,'rgba(20,30,70,.75)'); g.strokeStyle='#ffe27a'; g.lineWidth=8; g.lineCap='round'; g.beginPath(); g.arc(x,y,30,-Math.PI/2,-Math.PI/2+k*Math.PI*2); g.stroke();
    g.strokeStyle='#fff'; g.lineWidth=4; g.beginPath(); g.arc(x,y,13,0.3,Math.PI*1.7); g.stroke();
    g.fillStyle='#fff'; g.beginPath(); g.moveTo(x+13,y-14); g.lineTo(x+16,y-2); g.lineTo(x+4,y-5); g.closePath(); g.fill(); }
  if (speech){ if (tito) { drawBubbleText(g, tito.x+220, tito.y-50, speech.text); } else drawBubbleText(g, W/2, TOP+130, speech.text); }
  if (boss && boss.hp>0){ const w=360; rrect(g,W/2-w/2-4,TOP+10,w+8,26,13,'rgba(0,0,0,.4)'); rrect(g,W/2-w/2,TOP+14,w*boss.hp/boss.max,18,9,'#a8abc4'); }
}
function drawPlayer(g,p,t){
  const blink = p.inv>0 && !p.bubble && Math.floor(t*12)%2===0;
  // anillo de color debajo
  g.strokeStyle=COLORS[p.who]; g.lineWidth=4; g.globalAlpha=.8; g.beginPath(); g.ellipse(p.x,p.y+18,24,9,0,0,Math.PI*2); g.stroke(); g.globalAlpha=1;
  if (blink) g.globalAlpha=.35;
  drawKid(g,p.who,p.x,p.y+18,1,p.face,p.walk,p.moving,t,{hammer:p.who==='sofia'&&p.golpe, potion:p.who==='diego'&&p.magic, swing:p.swing});
  if (p.key) drawKey(g,p.x+26,p.y-50,p.key,0.8,-0.5+Math.sin(t*3)*0.15);
  g.globalAlpha=1;
  if (p.bubble){ g.globalAlpha=.35; circle(g,p.x,p.y-22,52,'#bfefff'); g.globalAlpha=1;
    g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=4; g.beginPath(); g.arc(p.x,p.y-22,52,0,Math.PI*2); g.stroke();
    circle(g,p.x-20,p.y-48,8,'rgba(255,255,255,.8)'); }
  // nombre
  g.font='bold 20px system-ui,Segoe UI,Roboto,Arial,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  const nm=NAMES[p.who], tw=g.measureText(nm).width+18, ny=p.y-(p.who==='sofia'?100:92);
  rrect(g,p.x-tw/2,ny-13,tw,26,13,COLORS[p.who]); g.fillStyle='#fff'; g.fillText(nm,p.x,ny+1);
  // cargas de disparo a los lados del nombre
  if (!p.bubble) for (let k=0;k<AMMO_MAX;k++){
    const ox=p.x+(k?1:-1)*(tw/2+12), full=k<p.ammo;
    circle(g,ox,ny,8,'rgba(0,0,0,.35)');
    if (full) { circle(g,ox,ny,6,p.who==='sofia'?'#ff9ae0':'#ffb020'); circle(g,ox-2,ny-2,2,'rgba(255,255,255,.8)'); }
    else if (k===p.ammo){ g.strokeStyle=p.who==='sofia'?'#ff9ae0':'#ffb020'; g.lineWidth=3; g.beginPath(); g.arc(ox,ny,5,-Math.PI/2,-Math.PI/2+Math.PI*2*p.ammoT/AMMO_TIME); g.stroke(); }
  }
}
function drawParts(g){
  for (const pt of parts){ g.globalAlpha=Math.max(0,pt.life/pt.max);
    if (pt.star) star(g,pt.x,pt.y,pt.s*1.4,pt.life*5,pt.c,null); else { g.fillStyle=pt.c; g.fillRect(pt.x-pt.s/2,pt.y-pt.s/2,pt.s,pt.s); } }
  g.globalAlpha=1;
}
function paintPot(g,x,y,full){
  rrect(g,x-11,y-8,22,20,5,full?'#ffffff':'rgba(255,255,255,.25)');
  if (full){ for (let k=0;k<3;k++){ g.fillStyle=RAINBOW[k*2]; g.fillRect(x-11+k*7.3,y-8,7.3,7); } }
  g.strokeStyle='rgba(255,255,255,.7)'; g.lineWidth=2; g.beginPath(); g.arc(x,y-8,9,Math.PI,0); g.stroke();
}
function drawHUD(g,t){
  const gr=g.createLinearGradient(0,0,0,TOP); gr.addColorStop(0,'#2c3d86'); gr.addColorStop(1,'#1c275c');
  g.fillStyle=gr; g.fillRect(0,0,W,TOP);
  g.fillStyle='rgba(255,255,255,.12)'; g.fillRect(0,0,W,2);
  const sh=g.createLinearGradient(0,TOP,0,TOP+10); sh.addColorStop(0,'rgba(0,0,0,.3)'); sh.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=sh; g.fillRect(0,TOP,W,10);
  const slots=[{x:52,al:1},{x:W-52,al:-1}];
  ['diego','sofia'].forEach((who,i)=>{
    const p=players.find(q=>q.who===who); const s=slots[i];
    circle(g,s.x,TOP/2,30,COLORS[who]); circle(g,s.x,TOP/2,26,'rgba(255,255,255,.25)');
    drawFace(g,who,s.x,TOP/2+4,1.15);
    if (!p){ g.fillStyle='rgba(255,255,255,.6)'; g.font='bold 20px system-ui,Arial'; g.textAlign=i?'right':'left'; g.textBaseline='middle';
      g.fillText('Pulsa A para jugar', s.x+s.al*40, TOP/2); return; }
    rrect(g, i? s.x-232 : s.x+34, TOP/2-20, 198, 40, 20, 'rgba(0,0,0,.22)');
    for (let k=0;k<5;k++) heart(g, s.x+s.al*(56+k*36), TOP/2+4, 14, k<p.hearts?'#ff4d6d':'rgba(255,255,255,.18)', k<p.hearts?'#b3123a':null);
  });
  if (starsTotal){
    const n=starsTotal, gap=46, x0=W/2-(n-1)*gap/2;
    rrect(g,x0-30,TOP/2-24,(n-1)*gap+60,48,24,'rgba(0,0,0,.22)');
    for (let k=0;k<n;k++) star(g,x0+k*gap,TOP/2+2,17,0,k<starsGot?'#ffd93b':'rgba(255,255,255,.12)',k<starsGot?'#e8a200':'rgba(255,255,255,.35)',2.5);
  } else if (L && L.boss){ star(g,W/2,TOP/2+2,22,t,'#ffd93b'); }
  // botes de pintura de Sofía
  if (L && L.paint!=null){ const x0=W/2+ (starsTotal*46)/2 + 50; for (let k=0;k<L.paint;k++) paintPot(g,x0+k*30,TOP/2+2,k<paintLeft); }
  // ayuda para los mayores: deshacer y reiniciar
  if (goldGot) drawGold(g, W/2-(starsTotal*46)/2-56, TOP/2+2, t);
  if (L){
    const txt = L.basic ? 'A y X: disparar   ·   Y: deshacer   ·   mantener Y: empezar de nuevo' : 'A: magia   ·   X: golpe   ·   Y: deshacer   ·   mantener Y: empezar de nuevo';
    g.font='bold 15px system-ui,Arial'; g.textAlign='center'; g.textBaseline='middle';
    const w=g.measureText(txt).width+24; rrect(g,W/2-w/2,H-26,w,22,11,'rgba(0,0,0,.35)'); g.fillStyle='rgba(255,255,255,.9)'; g.fillText(txt,W/2,H-15);
  }
}
// ------------------------------------------------------------- pantallas
function skyBg(g,t,c1='#14204d',c2='#3b2e7a'){
  const gr=g.createLinearGradient(0,0,0,H); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fillRect(0,0,W,H);
}
function bigText(g,text,x,y,size,fill='#ffe27a'){
  g.font=`900 ${size}px system-ui,Segoe UI,Roboto,Arial,sans-serif`; g.textAlign='center'; g.textBaseline='middle';
  g.lineWidth=size/6; g.strokeStyle='rgba(20,20,60,.7)'; g.lineJoin='round'; g.strokeText(text,x,y); g.fillStyle=fill; g.fillText(text,x,y);
}
const SKY_STARS=[...Array(70)].map((_,i)=>({x:(i*173)%W, y:(i*97)%(H*0.6), r:1+(i%3)}));
function drawTitle(t){
  const g=ctx; skyBg(g,t);
  for (const s of SKY_STARS){ g.globalAlpha=.3+.3*Math.sin(t*2+s.x); circle(g,s.x,s.y,s.r,'#fff'); } g.globalAlpha=1;
  ellipse(g,W/2,H+260,900,420,'#3f9a34'); ellipse(g,W/2,H+280,820,400,'#4fb043');
  bigText(g,'Las estrellas perdidas',W/2,110,78);
  // los dos protagonistas
  const pos=[W/2-230, W/2+230];
  for (let s=0;s<2;s++){
    const who=charOf[s], x=pos[s], y=520;
    const lit=active[s];
    circle(g,x,y-70,120,lit?'rgba(255,255,255,.16)':'rgba(255,255,255,.05)');
    drawKid(g,who,x,y,2.6,s===0?1:-1,t*8,false,t);
    g.font='bold 40px system-ui,Arial'; g.textAlign='center'; g.textBaseline='middle';
    rrect(g,x-110,y+20,220,56,28,COLORS[who]); g.fillStyle='#fff'; g.fillText(NAMES[who],x,y+49);
    // mando
    drawPadIcon(g,x,y+112,s+1,lit);
  }
  drawTito(g,W/2,500,t);
  // flechas para cambiar
  g.fillStyle='rgba(255,255,255,.75)'; g.font='bold 30px system-ui,Arial'; g.fillText('◀ ▶', W/2, 600);
  // progreso
  if (prog.max>1){ const n=prog.max-1+(prog.won?1:0); star(g,W/2-40,210,20,0,'#ffd93b','#a07a00',2); bigText(g,n+' / '+MAIN,W/2+30,212,34,'#ffffff'); }
  const k=0.5+0.5*Math.sin(t*4);
  g.globalAlpha=.6+.4*k; bigText(g,'Pulsa A para empezar',W/2,H-36,36,'#ffffff'); g.globalAlpha=1;
  drawParts(g);
}
function drawPadIcon(g,x,y,n,lit){
  rrect(g,x-46,y-22,92,44,22,lit?'#ffffff':'rgba(255,255,255,.35)');
  circle(g,x-26,y,7,'#556'); circle(g,x+24,y-6,5,'#3cbf5a'); circle(g,x+34,y+4,5,'#e84a4a');
  g.fillStyle='#223'; g.font='bold 22px system-ui,Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(n, x, y+1);
}
function drawStory(t){
  const g=ctx; skyBg(g,t,'#0b1233','#25225a');
  if (storyPage===0){
    for (const s of SKY_STARS){ const k=(s.x/W); circle(g,s.x+ (t*30*(1+k))%40, s.y, s.r, 'rgba(255,255,255,'+(0.1)+')'); }
    for (let i=0;i<4;i++) drawCloud(g,180+i*300+Math.sin(t+i)*30,200+(i%2)*80,2.2,t+i);
    for (let i=0;i<5;i++) star(g,200+i*220+Math.sin(t*2+i)*20,170+((t*30+i*40)%60),14,t,'#ffd93b');
  } else {
    for (const s of SKY_STARS){ circle(g,s.x,s.y,s.r,'rgba(255,255,255,.08)'); }
    ellipse(g,W/2,H+200,900,380,'#3f9a34');
    drawTito(g,W/2,420,t); g.save(); g.translate(W/2,420); g.restore();
    drawKid(g,charOf[0],W/2-260,560,2.2,1,0,false,t); drawKid(g,charOf[1],W/2+260,560,2.2,-1,0,false,t);
  }
  drawBubbleText(g,W/2,H-80,tpl(STORY[storyPage]),900);
  g.globalAlpha=.6+.4*Math.sin(t*4); g.fillStyle='#fff'; g.font='bold 26px system-ui,Arial'; g.textAlign='center'; g.fillText('A ▶',W-70,H-30); g.globalAlpha=1;
}
function drawTrain(t){
  const g=ctx, Lv=LEVELS[levelIdx], th=THEMES[Lv.theme];
  skyBg(g,t,'#8fd3ff','#d9f2ff');
  ellipse(g,300,H-120,500,200,th.g2); ellipse(g,1000,H-110,520,190,th.g1);
  g.fillStyle=th.dark; g.fillRect(0,H-150,W,150);
  g.fillStyle='#6b4a2b'; for (let x=-((t*400)%60); x<W; x+=60) g.fillRect(x,H-128,30,12);
  g.fillStyle='#555'; g.fillRect(0,H-122,W,4); g.fillRect(0,H-110,W,4);
  const tx = -500 + stateT*620;
  // tren
  g.save(); g.translate(tx, H-140);
  for (let k=0;k<2;k++){ const x=k*190;
    rrect(g,x,-110,170,90,14,k?COLORS[charOf[1]]:COLORS[charOf[0]]);
    rrect(g,x+20,-100,130,50,10,'#cfefff');
    drawKid(g,charOf[k],x+85,-30,1.1,1,0,false,t);
    circle(g,x+35,-14,16,'#333'); circle(g,x+135,-14,16,'#333'); circle(g,x+35,-14,6,'#999'); circle(g,x+135,-14,6,'#999'); }
  const x=380; rrect(g,x,-140,180,120,16,'#e8333a'); rrect(g,x+120,-180,40,50,6,'#333'); rrect(g,x+20,-120,70,50,8,'#cfefff');
  drawTito(g,x+55,-82,t);
  circle(g,x+40,-14,20,'#333'); circle(g,x+140,-14,20,'#333'); circle(g,x+40,-14,7,'#999'); circle(g,x+140,-14,7,'#999');
  for (let k=0;k<4;k++){ const s=((t*1.5+k*0.25)%1); g.globalAlpha=1-s; circle(g,x+140-s*120,-190-s*80,14+s*24,'#ffffff'); } g.globalAlpha=1;
  g.restore();
  bigText(g,Lv.name,W/2,150,72,'#ffffff');
  if (levelIdx<MAIN){ const w=worldOf(levelIdx); for (let k=0;k<6;k++) star(g,W/2+(k-2.5)*56,240,18,0,w*6+k<=levelIdx?'#ffd93b':'rgba(255,255,255,.5)','#a07a00',2); }
  else drawGold(g,W/2,240,t);
}
function drawClearOverlay(t){
  const g=ctx; g.fillStyle='rgba(20,20,60,.35)'; g.fillRect(0,0,W,H);
  bigText(g,'¡Muy bien!',W/2,H/2-30,110);
  for (let k=0;k<5;k++) star(g,W/2+(k-2)*90,H/2+80,30+Math.sin(t*6+k)*4,t+k,'#ffd93b');
}
function drawEnd(t){
  const g=ctx; skyBg(g,t,'#0b1233','#3b2e7a');
  const n=Math.min(SKY_STARS.length, Math.floor(stateT*20));
  for (let i=0;i<n;i++){ const s=SKY_STARS[i]; star(g,s.x,s.y,4+s.r*2,t*0.5+i,'#ffe27a',null); }
  ellipse(g,W/2,H+200,900,380,'#3f9a34');
  drawTito(g,W/2,470+Math.abs(Math.sin(t*4))*-20,t);
  drawKid(g,charOf[0],W/2-230,600-Math.abs(Math.sin(t*5))*30,2.2,1,0,false,t);
  drawKid(g,charOf[1],W/2+230,600-Math.abs(Math.sin(t*5+1))*30,2.2,-1,0,false,t);
  bigText(g,`¡Gracias, ${NAMES.diego} y ${NAMES.sofia}!`,W/2,110,64);
  bigText(g,'Las estrellas vuelven a brillar',W/2,190,40,'#ffffff');
  drawParts(g);
  if (stateT>4){ g.globalAlpha=.6+.4*Math.sin(t*4); bigText(g,'Pulsa A',W/2,H-40,32,'#ffffff'); g.globalAlpha=1; }
}
function drawPause(){
  const g=ctx; g.fillStyle='rgba(10,10,40,.6)'; g.fillRect(0,0,W,H);
  bigText(g,'Pausa',W/2,H/2-30,100,'#ffffff'); bigText(g,'Pulsa A para seguir',W/2,H/2+60,36,'#ffe27a'); bigText(g,'B: volver al mapa',W/2,H/2+120,28,'#ffffff');
}

function drawMap(t){
  const g=ctx; skyBg(g,t,'#1b2a63','#4a3a8a');
  for (const s of SKY_STARS){ g.globalAlpha=.25+.25*Math.sin(t*2+s.x); circle(g,s.x,s.y,s.r,'#fff'); } g.globalAlpha=1;
  bigText(g,'Las estrellas perdidas',W/2,40,40);
  const TH=['pradera','nieve','templo','pintura','castillo'];
  for (let w=0;w<5;w++){
    const th=THEMES[TH[w]], y=134+w*106, open=unlocked(w*6);
    rrect(g,40,y-46,1060,92,36, open?th.g1:'rgba(255,255,255,.08)');
    if (open){ g.globalAlpha=.5; rrect(g,40,y+18,1060,28,20,th.dark); g.globalAlpha=1; }
    g.font='bold 18px system-ui,Arial'; g.textAlign='left'; g.textBaseline='middle'; g.fillStyle=open?'rgba(30,30,60,.75)':'rgba(255,255,255,.35)';
    g.fillText((w+1)+'. '+WORLDS[w], 64, y-31);
    // camino
    g.strokeStyle=open?'rgba(255,255,255,.8)':'rgba(255,255,255,.15)'; g.lineWidth=6; g.setLineDash([2,12]); g.lineCap='round';
    g.beginPath(); g.moveTo(mapPos(w*6).x,y+6); g.lineTo(mapPos(w*6+5).x,y+6); g.stroke();
    g.beginPath(); g.moveTo(mapPos(w*6+5).x,y+6); g.lineTo(mapPos(MAIN+w).x,y+6); g.stroke(); g.setLineDash([]);
  }
  for (const i of MAP_ORDER){
    const {x,y}=mapPos(i), sel=i===mapSel, op=unlocked(i), done=finished(i);
    if (i>=MAIN){
      if (op){ drawGold(g,x,y+4,t); if (done){ circle(g,x+22,y+24,11,'#3fae55'); g.strokeStyle='#fff'; g.lineWidth=3; g.beginPath(); g.moveTo(x+16,y+24); g.lineTo(x+21,y+29); g.lineTo(x+28,y+19); g.stroke(); } }
      else { circle(g,x,y+4,28,'rgba(255,255,255,.1)'); g.fillStyle='rgba(255,255,255,.4)'; g.font='bold 30px system-ui,Arial'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('?',x,y+6); }
    } else {
      const r = sel?34:28;
      circle(g,x,y+8,r,'rgba(0,0,0,.25)');
      circle(g,x,y+4,r, !op?'#7a7f99': done?'#ffd93b':'#ffffff');
      if (op && !done){ g.globalAlpha=.4+.3*Math.sin(t*5); g.strokeStyle='#ffd93b'; g.lineWidth=5; g.beginPath(); g.arc(x,y+4,r+6,0,Math.PI*2); g.stroke(); g.globalAlpha=1; }
      g.fillStyle=!op?'rgba(255,255,255,.5)':'#2a2a50'; g.font=`900 ${sel?28:24}px system-ui,Arial`; g.textAlign='center'; g.textBaseline='middle';
      if (i===MAIN-1) drawCloud(g,x,y+2,0.8,t,'#62667e',true); else g.fillText(i+1,x,y+6);
    }
    if (sel){ const b=Math.abs(Math.sin(t*4))*8;
      g.strokeStyle='#ffffff'; g.lineWidth=5; g.beginPath(); g.arc(x,y+4,i>=MAIN?42:40,0,Math.PI*2); g.stroke();
      drawFace(g,charOf[0],x-20,y-50-b,0.95); if (active[1]) drawFace(g,charOf[1],x+20,y-50-b,0.95); }
  }
  // nombre del nivel elegido
  const Lv=LEVELS[mapSel];
  rrect(g,W/2-330,H-54,660,46,23,'rgba(0,0,0,.35)');
  bigText(g,Lv.name,W/2,H-31,30,'#ffffff');
  g.font='bold 18px system-ui,Arial'; g.fillStyle='rgba(255,255,255,.7)'; g.textAlign='right'; g.fillText('A: jugar',W-30,H-31);
  g.textAlign='left'; g.fillText('B: volver',30,H-31);
  drawParts(g);
}
// ------------------------------------------------------------- bucle
let last=now();
function frame(){
  const t=now(); let dt=Math.min(1/30, t-last); last=t;
  try{
    update(dt);
    ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#10183a'; ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(scale*dpr,0,0,scale*dpr,offX*dpr,offY*dpr);
    ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
    if (state==='title') drawTitle(t);
    else if (state==='map') drawMap(t);
    else if (state==='story') drawStory(t);
    else if (state==='train') drawTrain(t);
    else if (state==='end') drawEnd(t);
    else { drawPlay(t); if (state==='clear') drawClearOverlay(t); if (state==='pause') drawPause(); }
    ctx.restore();
  }catch(e){ console.error(e); }
  requestAnimationFrame(frame);
}
// para pruebas: ?nivel=3 empieza directamente en ese nivel
if (QS.get('nivel')){ active=[true, QS.get('solo')!=='1']; levelIdx=clamp((+QS.get('nivel')|0)-1,0,LEVELS.length-1); state='play'; loadLevel(levelIdx); }
if (QS.get('mapa')){ active=[true,true]; if (QS.get('mapa')==='todo'){ prog={max:MAIN,gold:[0,1,2,3,4],done:[0],story:true,won:false}; } goMap(); }
requestAnimationFrame(frame);
addEventListener('pointerdown', ()=>audio());
</script>
