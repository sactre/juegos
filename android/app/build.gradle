plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sactre.collar'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sactre.collar'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName '2.1'
    }

    // misma firma en cada compilación, para poder actualizar la app sin desinstalarla
    signingConfigs {
        juegos {
            storeFile file('juegos.keystore')
            storePassword 'juegos-tv'
            keyAlias 'juegos'
            keyPassword 'juegos-tv'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.juegos }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
