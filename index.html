<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="version" content="6 (28 nov)">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juegos de casa</title>
<style>
  :root{ --bg:#0f3b2a; --card:#1d5c3f; --text:#ffffff; --accent:#ffe28a; }
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;padding:6vh 16px;box-sizing:border-box;
    background:radial-gradient(circle at 50% 30%,#2f7a4f,#0f3b2a 70%);min-height:100vh;}
  h1{font-size:clamp(36px,6vw,80px);color:var(--accent);margin:0 0 5vh;text-shadow:0 4px 0 rgba(0,0,0,.4);}
  .games{display:flex;flex-wrap:wrap;gap:4vw;justify-content:center;}
  a.game{display:flex;flex-direction:column;align-items:center;gap:16px;text-decoration:none;color:var(--text);
    background:var(--card);border:6px solid transparent;border-radius:32px;padding:32px 48px;
    font-size:clamp(28px,3.5vw,52px);font-weight:bold;box-shadow:0 10px 0 rgba(0,0,0,.35);outline:none;
    transition:transform .15s,border-color .15s;}
  a.game:focus,a.game:hover{border-color:var(--accent);transform:scale(1.08);}
  .balls{display:flex;gap:10px}
  .balls span{width:54px;height:54px;border-radius:50%;box-shadow:inset -6px -8px 0 rgba(0,0,0,.25),inset 6px 6px 0 rgba(255,255,255,.35);}
  .balls span.star{box-shadow:none;width:auto;height:54px;font-size:54px;line-height:54px;color:#ffd93b;text-shadow:0 3px 0 #a07a00;}
  a.game.upd{margin-top:5vh;padding:14px 32px;font-size:clamp(18px,2vw,28px);background:#14402c;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.35);}
  .ver{font-size:clamp(16px,1.6vw,24px);font-weight:normal;opacity:.8;min-height:1.2em;}
  p.ver-all{margin-top:3vh;font-size:clamp(16px,1.6vw,24px);opacity:.75;text-align:center;}
  p.hint{margin-top:6vh;font-size:clamp(20px,2.4vw,34px);opacity:.85;text-align:center;}
</style>
</head>
<body>
  <h1>Juegos de casa</h1>
  <div class="games">
    <a class="game" href="bolas/" autofocus>
      <div class="balls"><span style="background:#e53935"></span><span style="background:#f7c600"></span><span style="background:#1f6fe5"></span><span style="background:#24a83c"></span></div>
      Collar de Colores
      <span class="ver"></span>
    </a>
    <a class="game" href="aventura/">
      <div class="balls"><span class="star">★</span><span class="star">★</span><span class="star">★</span></div>
      Las estrellas perdidas
      <span class="ver"></span>
    </a>
  </div>
  <a class="game upd" id="upd" href="#">Buscar actualizaciones</a>
  <p class="hint">Pulsa OK en el mando para jugar</p>
  <p class="ver-all" id="verAll"></p>
<script>
  const links=[...document.querySelectorAll('a.game')];
  // sin pantalla táctil (tele u ordenador): el juego entra en modo tele
  const touch=(navigator.maxTouchPoints||0)>0 || 'ontouchstart' in window;
  // Normalmente se usa la copia guardada (carga más rápido). El botón "Buscar actualizaciones"
  // guarda una marca nueva: a partir de ahí los juegos se piden otra vez a internet.
  let ver=''; try{ ver=localStorage.getItem('juegos.v')||''; }catch(e){}
  const q=[]; if(!touch) q.push('tv=1'); if(ver) q.push('v='+ver);
  links.forEach(a=>{ if(a.id!=='upd') a.href=a.getAttribute('href')+(q.length?'?'+q.join('&'):''); });
  document.getElementById('upd').addEventListener('click',e=>{
    e.preventDefault();
    const v=String(Date.now()); try{ localStorage.setItem('juegos.v',v); }catch(e){}
    document.getElementById('upd').textContent='Actualizando…';
    location.replace(location.pathname+'?v='+v);
  });
  // versión de cada juego: se lee del mismo archivo que se va a abrir (con la misma marca de
  // actualización), así se ve si "Buscar actualizaciones" ha traído una versión nueva
  links.forEach(a=>{ const sp=a.querySelector('.ver'); if(!sp) return;
    fetch(a.href).then(r=>r.text()).then(t=>{ const m=t.match(/<meta name="version" content="([^"]*)"/); if(m) sp.textContent='Versión '+m[1]; }).catch(()=>{});
  });
  { const pv=document.querySelector('meta[name=version]').content; let app='';
    try{ if(window.AndroidApp&&AndroidApp.version) app=' · App de la tele '+AndroidApp.version(); }catch(e){}
    document.getElementById('verAll').textContent='Portada '+pv+app; }
  links[0].focus();
  addEventListener('keydown',e=>{
    const i=links.indexOf(document.activeElement);
    if(e.keyCode===37||e.keyCode===38){ links[Math.max(0,i-1)].focus(); e.preventDefault(); }
    if(e.keyCode===39||e.keyCode===40){ links[Math.min(links.length-1,i+1)].focus(); e.preventDefault(); }
  });
  // dentro de la app de la tele: el mando llega por aquí
  function go(d){ const i=Math.max(0,links.indexOf(document.activeElement)); links[Math.min(links.length-1,Math.max(0,i+d))].focus(); }
  let stickT=0;
  window.__pad={
    key(code,down){ if(!down) return; if(code===37||code===38) go(-1); else if(code===39||code===40) go(1); else if(code===13) (document.activeElement.href?document.activeElement:links[0]).click(); },
    axes(x,y){ const t=Date.now(); if(Math.abs(x)<0.6&&Math.abs(y)<0.6){ stickT=0; return; } if(t-stickT<400) return; stickT=t; go((Math.abs(x)>Math.abs(y)?x:y)>0?1:-1); },
    pause(){},
  };
  // mando de consola: botón A abre el juego seleccionado
  (function poll(){
    try{ for(const gp of navigator.getGamepads?navigator.getGamepads():[]){ if(gp&&gp.buttons[0]&&gp.buttons[0].pressed){ (document.activeElement.href?document.activeElement:links[0]).click(); return; } } }catch(e){}
    requestAnimationFrame(poll);
  })();
</script>
</body>
</html>
