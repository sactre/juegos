<script>
(function(){
'use strict';
const W = 1600, H = 900, R = 27, D = 54;
const SX = 800, SY = 450;               // posición de la tortuga
const FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
const COLORS = [
  { c:'#e53935', d:'#8e0f12', l:'#ffb3ad', sym:'star',     sc:'#ffffff' },
  { c:'#f7c600', d:'#a26b00', l:'#fff6b8', sym:'circle',   sc:'#6b4700' },
  { c:'#1f6fe5', d:'#0b347e', l:'#a9ccff', sym:'diamond',  sc:'#ffffff' },
  { c:'#24a83c', d:'#0c5a1c', l:'#b6f0c0', sym:'triangle', sc:'#ffffff' },
  { c:'#a03fd6', d:'#521577', l:'#ebc6fb', sym:'square',   sc:'#ffffff' },
];
// speed: velocidad al empezar (px/s). Luego sube según la dificultad (ver DIFFS).
const LEVELS = [
  { path:0, colors:3, count:40, speed:15 },
  { path:1, colors:3, count:48, speed:17 },
  { path:2, colors:4, count:50, speed:18 },
  { path:0, colors:4, count:58, speed:20 },
  { path:1, colors:4, count:62, speed:22 },
  { path:2, colors:5, count:62, speed:23 },
];
function levelInfo(n){
  const base = LEVELS[(n-1) % LEVELS.length];
  const extra = Math.floor((n-1) / LEVELS.length);
  return { path:base.path, colors:Math.min(5, base.colors + (extra>0?1:0)),
           count: base.count + extra*6, speed: Math.min(34, base.speed + extra*3) };
}
// dificultad: todas empiezan igual de rápido y suben un 1 % cada `every` segundos, hasta el doble.
// También cambian los colores, cuántas bolas iguales salen seguidas y bolas especiales
const DIFFS = [
  { name:'Fácil',   col:'#7fe08a', speed:1, every:5, extraColors:0, count:1.0, repeat:0.45, maxRun:2, nearHole:0.7,  powerGap:11 },
  { name:'Normal',  col:'#ffd54f', speed:1, every:3, extraColors:1, count:1.15, repeat:0.25, maxRun:2, nearHole:0.85, powerGap:15 },
  { name:'Difícil', col:'#ff6a4a', speed:1, every:1, extraColors:2, count:1.3, repeat:0.08, maxRun:1, nearHole:1.0,  powerGap:22 },
];
let diff = Math.max(0, Math.min(2, load('cdc_diff', 0)));
function setDiff(d){ d=Math.max(0,Math.min(2,d)); if (d!==diff){ diff=d; save('cdc_diff',diff); sfx.swap(); } }
const MAX_MULT = 2;      // como mucho, el doble de rápido   // segundos hasta la velocidad máxima del nivel

// ---------- caminos ----------
function chaikin(pts, iter){
  for (let k=0;k<iter;k++){
    const out=[pts[0]];
    for (let i=0;i<pts.length-1;i++){
      const a=pts[i], b=pts[i+1];
      out.push([a[0]*0.75+b[0]*0.25, a[1]*0.75+b[1]*0.25]);
      out.push([a[0]*0.25+b[0]*0.75, a[1]*0.25+b[1]*0.75]);
    }
    out.push(pts[pts.length-1]);
    pts=out;
  }
  return pts;
}
function densify(pts, step){
  const out=[];
  for (let i=0;i<pts.length-1;i++){
    const a=pts[i], b=pts[i+1], d=Math.hypot(b[0]-a[0], b[1]-a[1]);
    const n=Math.max(1, Math.ceil(d/step));
    for (let j=0;j<n;j++) out.push([a[0]+(b[0]-a[0])*j/n, a[1]+(b[1]-a[1])*j/n]);
  }
  out.push(pts[pts.length-1]);
  return out;
}
function spiral(turns, r0, r1, wave){
  const pts=[]; const n=1600;
  for (let i=0;i<=n;i++){
    const t=i/n, th=-Math.PI/2 + t*turns*Math.PI*2;
    let r=r0*(1-t)+r1*t;
    if (wave) r += wave*Math.sin(th*6);
    pts.push([SX + 1.7*r*Math.cos(th), SY + r*Math.sin(th)]);
  }
  pts.unshift([SX, -60]);
  return densify(pts, 4);
}
function serpentine(){
  const poly=[[-60,80],[1520,80],[1520,800],[80,800],[80,200],[1380,200],[1380,700],[220,700],[220,330],[640,330]];
  return densify(chaikin(poly,5), 4);
}
function makePath(kind){
  const pts = kind===0 ? spiral(2.0, 405, 175, 0)
            : kind===1 ? serpentine()
            : spiral(1.6, 395, 185, 26);
  const cum=[0];
  for (let i=1;i<pts.length;i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
  // la parte inicial fuera de pantalla no cuenta: s=0 es donde aparecen las bolas
  let s0=0;
  for (let i=0;i<pts.length;i++){ if (pts[i][1] >= 20 && pts[i][0] >= 20){ s0=cum[i]; break; } }
  return { pts, cum, s0, L: cum[cum.length-1]-s0, kind };
}
function pathPos(p, s){
  let d = s + p.s0;
  const cum=p.cum, pts=p.pts;
  if (d<=0) return { x:pts[0][0], y:pts[0][1] };
  if (d>=cum[cum.length-1]) { const q=pts[pts.length-1]; return { x:q[0], y:q[1] }; }
  let lo=0, hi=cum.length-1;
  while (hi-lo>1){ const m=(lo+hi)>>1; if (cum[m]<=d) lo=m; else hi=m; }
  const t=(d-cum[lo])/((cum[hi]-cum[lo])||1);
  return { x: pts[lo][0]+(pts[hi][0]-pts[lo][0])*t, y: pts[lo][1]+(pts[hi][1]-pts[lo][1])*t };
}

// ---------- estado ----------
const cv=document.getElementById('c'); let ctx=cv.getContext('2d');
// el fondo va en otra capa y solo se dibuja cuando cambia (mucho más ligero en la tele)
const bgcv=document.getElementById('bg'), bctx=bgcv.getContext('2d', {alpha:false});
let bgShown=null;
let scale=1, offX=0, offY=0, dpr=1;
// las teles tienen poca potencia: dibujamos a menos resolución
const IN_APP = !!window.AndroidApp;
const LOWPOWER = IN_APP || /SMART-?TV|Tizen|Web0S|webOS|NetCast|Android ?TV|GoogleTV|BRAVIA|AFT|CrKey|HbbTV/i.test(navigator.userAgent||'') || /[?&]tv=1/.test(location.search);
function resize(){
  dpr=Math.min(2, window.devicePixelRatio||1);
  if (LOWPOWER) dpr=Math.min(1, 1280/Math.max(1,innerWidth));
  cv.width=Math.round(innerWidth*dpr); cv.height=Math.round(innerHeight*dpr);
  bgcv.width=cv.width; bgcv.height=cv.height; bgShown=null;
  scale=Math.min(innerWidth/W, innerHeight/H);
  offX=(innerWidth-W*scale)/2; offY=(innerHeight-H*scale)/2;
}
addEventListener('resize', resize); addEventListener('orientationchange', ()=>setTimeout(resize,200)); resize();

function load(k, d){ try { const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); } catch(e){ return d; } }
function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

const LIVES=1;   // cuando las bolas llegan al agujero se acaba la partida
let lives = LIVES;
let level = 1, score = 0;   // cada vez que se abre el juego empieza desde el nivel 1
let state='title', stateT=0;
let path, info, balls=[], queue=[], shot=null, particles=[], rings=[], texts=[];
let aim=-Math.PI/2, cur=0, nxt=1, combo=1, rolling=true, levelScore=0;
let queuePow=[], slowT=0, backT=0, speedStep=0, banner=null;
// bonus final: cuanto más lejos del agujero quede la cabeza de la fila al ganar, más puntos
let lastFrontS=0, bonus=null, lastBonus=0;
const BONUS_PX=4;   // 1 punto por cada 4 px de camino libre
let playT=0, chainV=0, shake=0, usedTouch=false, swapAnim=0, recoil=0;
let bgCanvas=null;

function genChain(n, k){
  const D_=DIFFS[diff], maxRun=D_.maxRun;
  const out=[]; let run=0;
  for (let i=0;i<n;i++){
    let c;
    if (i>0 && run<maxRun && Math.random()<D_.repeat) c=out[i-1];
    else { do { c=Math.floor(Math.random()*k); } while (i>0 && c===out[i-1] && k>1 && (run>=maxRun || Math.random()<0.85)); }
    run = (i>0 && c===out[i-1]) ? run+1 : 1;
    out.push(c);
  }
  return out;
}
function startLevel(){
  info=levelInfo(level);
  const D_=DIFFS[diff];
  info.speed*=D_.speed; info.colors=Math.min(5, info.colors+D_.extraColors); info.count=Math.round(info.count*D_.count);
  path=makePath(info.path);
  bgCanvas=renderBackground(path);
  balls=[]; queue=genChain(info.count, info.colors);
  queuePow=queue.map(()=>null);
  const kinds=['bomb','slow','back'];
  for (let i=queue.length-10; i>4; i-=D_.powerGap+Math.floor(Math.random()*6)) queuePow[i]=kinds[Math.floor(Math.random()*3)];
  slowT=0; backT=0; speedStep=0; banner=null;
  shot=null; particles=[]; rings=[]; texts=[]; combo=1; rolling=true; levelScore=0;
  lastFrontS=0; bonus=null; lastBonus=0;
  playT=0; chainV=300;
  cur=pickColor(); nxt=pickColor();
  aim=-Math.PI/2;
  state='play'; stateT=0;
}
function presentColors(){
  const set=new Set();
  for (const b of balls) set.add(b.color);
  if (set.size===0) for (const c of queue) set.add(c);
  return [...set];
}
function pickColor(){
  const p=presentColors();
  if (!p.length) return Math.floor(Math.random()*(info?info.colors:3));
  return p[Math.floor(Math.random()*p.length)];
}
function fixShooterColors(){
  const p=presentColors(); if (!p.length) return;
  if (!p.includes(cur)) cur=pickColor();
  if (!p.includes(nxt)) nxt=pickColor();
}

// ---------- sonido ----------
let actx=null;
function audio(){
  if (!actx){ try { actx=new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} }
  if (actx && actx.state==='suspended') { try { actx.resume(); } catch(e){} }
}
function tone(f, dur, type, vol, slide, delay){
  if (!actx) return;
  try {
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime+(delay||0);
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.15,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  } catch(e){}
}
const sfx = {
  shoot(){ tone(380,0.12,'triangle',0.09,190); },
  hit(){ tone(220,0.06,'sine',0.08,160); },
  pop(n){ const b=520*Math.pow(1.122,Math.min(10,n-1));
    tone(b,0.16,'sine',0.17,b*1.5); tone(b*1.25,0.18,'sine',0.12,b*2,0.07); tone(b*1.5,0.22,'triangle',0.08,b*2.5,0.14); },
  win(){ [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.35,'triangle',0.14,null,i*0.13)); },
  lose(){ [392,330,262,196].forEach((f,i)=>tone(f,0.4,'triangle',0.12,null,i*0.2)); },
  swap(){ tone(700,0.07,'sine',0.07,900); },
};

// ---------- controles ----------
const held={left:false,right:false}, heldT={left:0,right:0}, lastKey={left:0,right:0};
function now(){ return performance.now(); }
// ---------- ranking de los 10 mejores (se guarda en este aparato) ----------
let lastNav=0, rankFromTitle=false, rankHighlight=-1;
function loadRanking(){ const r=load('cdc_ranking', []); return Array.isArray(r) ? r : []; }
function qualifies(sc){ if (sc<=0) return false; const r=loadRanking(); return r.length<10 || sc>r[r.length-1].s; }
function showRanking(highlight, fromTitle){ rankHighlight=highlight; rankFromTitle=fromTitle; state='ranking'; stateT=0; }
const KB=[ [...'ABCDEFGHIJ'], [...'KLMNÑOPQRS'], ['T','U','V','W','X','Y','Z','␣','⌫','OK'] ];
let kbR=0, kbC=0, nameText='', typedPhysical=false, kbBoxes=[], nameFresh=false;
function openNameEntry(){ nameText=String(load('cdc_name','')).slice(0,12); nameFresh=!!nameText; kbR=2; kbC=9; typedPhysical=false; state='name'; stateT=0; }
function kbMove(dx,dy){ kbR=(kbR+dy+KB.length)%KB.length; kbC=(kbC+dx+10)%10; sfx.swap(); }
// el último nombre usado sale ya escrito: OK lo guarda; si escribes una letra, se sustituye
function kbType(ch){
  if (nameFresh && ch!=='OK'){ nameFresh=false; nameText=''; if (ch==='⌫') return; }
  if (ch==='⌫') nameText=nameText.slice(0,-1);
  else if (ch==='OK') submitName();
  else if (nameText.length<12) nameText+= ch==='␣' ? ' ' : ch;
}
function kbPress(){ kbType(KB[kbR][kbC]); }
function kbHit(cx,cy){
  const p=toLogical(cx,cy);
  for (const b of kbBoxes) if (p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h){ kbR=b.r; kbC=b.c; kbPress(); return true; }
  return false;
}
function nameKey(e){
  const k=e.keyCode;
  if (e.preventDefault) e.preventDefault();
  if (e.key && e.key.length===1 && /[a-zñ ]/i.test(e.key)){ typedPhysical=true; kbType(e.key===' ' ? '␣' : e.key.toUpperCase()); return; }
  if (k===8){ kbType('⌫'); return; }
  if (k===37) kbMove(-1,0); else if (k===39) kbMove(1,0); else if (k===38) kbMove(0,-1); else if (k===40) kbMove(0,1);
  else if (k===13 || k===32){ if (e.repeat) return; if (typedPhysical && k===13) submitName(); else kbPress(); }
}
function submitName(){
  const name=nameText.trim() || 'Jugador';
  save('cdc_name', name);
  const r=loadRanking();
  const entry={ n:name, s:score, l:level, d:diff, t:Date.now() };
  r.push(entry); r.sort((a,b)=>b.s-a.s); r.length=Math.min(10,r.length);
  save('cdc_ranking', r);
  sfx.win();
  showRanking(r.indexOf(entry), false);
}
let rankBtn=null;
function rankBtnHit(cx,cy){ if (!rankBtn) return false; const p=toLogical(cx,cy); return p.x>=rankBtn.x && p.x<=rankBtn.x+rankBtn.w && p.y>=rankBtn.y && p.y<=rankBtn.y+rankBtn.h; }
function card(x,y,w,h){
  ctx.fillStyle='rgba(0,0,0,0.35)'; roundRect(x+6,y+12,w,h,36); ctx.fill();
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,'rgba(18,78,92,0.97)'); g.addColorStop(1,'rgba(6,36,48,0.97)');
  ctx.fillStyle=g; roundRect(x,y,w,h,36); ctx.fill();
  ctx.strokeStyle='#f4cf63'; ctx.lineWidth=4; ctx.stroke();
}
function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.'); }
function drawNameEntry(){
  ctx.fillStyle='rgba(2,12,18,0.4)'; ctx.fillRect(0,0,W,H);
  card(220,40,1160,820);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 70px '+FONT; shadowText('¡Nuevo récord!', W/2, 115, '#ffe28a', 10);
  ctx.font='bold 38px '+FONT; ctx.fillStyle='#fff'; ctx.fillText(fmt(score)+' puntos · escribe tu nombre', W/2, 190);
  // casilla del nombre
  ctx.fillStyle='rgba(0,0,0,0.45)'; roundRect(420,230,760,90,20); ctx.fill();
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=3; ctx.stroke();
  const blink = Math.floor(performance.now()/450)%2 ? '_' : ' ';
  ctx.font='bold 58px '+FONT;
  if (nameFresh){ const tw=ctx.measureText(nameText).width; ctx.fillStyle='rgba(255,226,138,0.3)'; ctx.fillRect(W/2-tw/2-8,247,tw+16,62); }
  ctx.fillStyle='#ffe28a'; ctx.fillText(nameText+(nameFresh?'':blink), W/2, 277);
  // teclado
  const kw=96, kh=84, gap=12, x0=W/2-(kw*10+gap*9)/2, y0=360;
  kbBoxes=[];
  KB.forEach((row,r)=>row.forEach((ch,c)=>{
    const x=x0+c*(kw+gap), y=y0+r*(kh+gap), sel=r===kbR && c===kbC;
    kbBoxes.push({x,y,w:kw,h:kh,r,c});
    ctx.fillStyle = sel ? '#ffe28a' : ch==='OK' ? '#2fae5a' : 'rgba(255,255,255,0.12)';
    roundRect(x,y,kw,kh,16); ctx.fill();
    ctx.lineWidth = sel ? 5 : 2; ctx.strokeStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.3)'; ctx.stroke();
    ctx.font='bold '+(ch.length>1?34:44)+'px '+FONT; ctx.fillStyle = sel ? '#10262e' : '#ffffff';
    ctx.fillText(ch, x+kw/2, y+kh/2+2);
  }));
  ctx.font='bold 30px '+FONT; ctx.fillStyle='#cfe9ee';
  ctx.fillText(usedTouch ? 'Toca las letras y luego OK' : 'Mueve con las flechas o la palanca · OK/A para elegir letra · OK verde para guardar', W/2, 690);
  ctx.fillText('␣ = espacio   ·   ⌫ = borrar', W/2, 740);
}
function drawRanking(){
  ctx.fillStyle='rgba(2,12,18,0.4)'; ctx.fillRect(0,0,W,H);
  card(260,30,1080,840);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 70px '+FONT; shadowText('Los 10 mejores', W/2, 100, '#ffe28a', 10);
  const r=loadRanking();
  if (!r.length){ ctx.font='bold 40px '+FONT; ctx.fillStyle='#fff'; ctx.fillText('Todavía no hay puntuaciones. ¡Juega una partida!', W/2, 420); }
  r.forEach((e,i)=>{
    const y=185+i*56, hi=i===rankHighlight;
    if (hi){ ctx.fillStyle='rgba(255,226,138,0.25)'; roundRect(300,y-25,1000,50,14); ctx.fill(); }
    ctx.font='bold 36px '+FONT; ctx.fillStyle = hi ? '#ffe28a' : i<3 ? ['#ffd54f','#e0e0e0','#ffb27a'][i] : '#ffffff';
    ctx.textAlign='right'; ctx.fillText((i+1)+'.', 380, y);
    ctx.textAlign='left'; ctx.fillText(e.n, 405, y);
    ctx.font='bold 26px '+FONT; ctx.fillStyle='rgba(255,255,255,0.7)';
    ctx.fillText('Nivel '+e.l+' · '+(DIFFS[e.d]?DIFFS[e.d].name:''), 820, y+2);
    ctx.font='bold 36px '+FONT; ctx.fillStyle = hi ? '#ffe28a' : '#ffffff';
    ctx.textAlign='right'; ctx.fillText(fmt(e.s), 1270, y);
  });
  const a=0.65+0.35*Math.sin(performance.now()/300);
  ctx.textAlign='center'; ctx.globalAlpha=a; ctx.fillStyle='#2fae5a'; roundRect(W/2-300,770,600,70,35); ctx.fill();
  ctx.globalAlpha=1; ctx.font='bold 38px '+FONT; ctx.fillStyle='#fff';
  ctx.fillText(okWord()+' para volver al inicio', W/2, 806);
}
function newGame(){ level=1; score=0; lives=LIVES; startLevel(); }
function confirm(){
  audio();
  if (state==='title') newGame();
  else if (state==='lose'){ if (stateT<0.6) return; startLevel(); }
  else if (state==='gameover'){ if (stateT<0.8) return; if (qualifies(score)) openNameEntry(); else showRanking(-1, false); }
  else if (state==='name') kbPress();
  else if (state==='ranking'){ if (stateT<0.4) return; state='title'; stateT=0; }
  else if (state==='win'){ if (stateT<0.6) return; level++; save('cdc_level',level); startLevel(); }
  else if (state==='pause') state='play';
  else if (state==='play') shoot();
}
function swap(){ if (state!=='play') return; const t=cur; cur=nxt; nxt=t; swapAnim=1; sfx.swap(); }
function onKeyDown(e){
  const k=e.keyCode;
  if ([13,32,37,38,39,40].includes(k)) e.preventDefault();
  if (state==='name'){ nameKey(e); return; }
  if (state==='title' && (k===40 || k===38)){ if (!e.repeat) showRanking(-1, true); return; }
  const menu = state==='title' || state==='win' || state==='lose';
  if (menu && (k===37 || k===39)){ if (!e.repeat) setDiff(diff + (k===37?-1:1)); audio(); return; }
  if (k===37 || k===39){
    const side = k===37?'left':'right';
    if (!held[side]){ held[side]=true; heldT[side]=0; aim += (side==='left'?-1:1)*0.05; }
    lastKey[side]=now();
    audio();
  } else if (k===38 || k===40){ if (!e.repeat) swap(); }
  else if (k===13 || k===32){ if (!e.repeat) confirm(); }
  else if (k===80 || k===19){ if (state==='play') state='pause'; else if (state==='pause') state='play'; }
}
function onKeyUp(e){
  if (e.keyCode===37) held.left=false;
  if (e.keyCode===39) held.right=false;
}
addEventListener('keydown', onKeyDown);
addEventListener('keyup', onKeyUp);
// la app de Android TV manda aquí los botones y la palanca del mando (sin cursor)
window.__pad = {
  key(code, down){ padName='app'; if (down) onKeyDown({ keyCode:code, repeat:false, preventDefault(){} }); else onKeyUp({ keyCode:code }); },
  pause(on){
    if (on && state==='play'){ state='pause'; pausedByApp=true; }
    else if (!on && pausedByApp && state==='pause'){ state='play'; pausedByApp=false; }
  },
  axes(x, y){
    padSeenT=now(); padName='app';

function toLogical(cx,cy){ return { x:(cx-offX)/scale, y:(cy-offY)/scale }; }
function aimAt(cx,cy){ const p=toLogical(cx,cy); if (Math.hypot(p.x-SX,p.y-SY) > 20) aim=Math.atan2(p.y-SY, p.x-SX); }

// ratón y cursor de la tele.
// En la tele la palanca del mando mueve un cursor: ahí la tortuga apunta hacia
// donde EMPUJAS (la dirección en que se mueve el cursor), como con una palanca.

const UA=navigator.userAgent||'';
const tvParam=(location.search.match(/[?&]tv=(\d)/)||[])[1];
const isDesktop=/Windows NT|Macintosh|X11|CrOS/.test(UA) && !/SMART-?TV|Tizen|Web0S|webOS|NetCast|Android ?TV|GoogleTV|BRAVIA|AFT|CrKey|HbbTV/i.test(UA);
const dirMode = IN_APP || (tvParam ? tvParam==='1' : !isDesktop);
// en la tele: 'cursor' = la tortuga mira al cursor; 'dir' = hacia donde se empuja (8 direcciones)
const TV_AIM = (location.search.match(/[?&]apuntar=(cursor|dir)/)||[])[1] || 'cursor';
let lastPointerEvt=0, lastPX=null, lastPY=null, sdx=0, sdy=0;
function locked(){ return document.pointerLockElement===cv; }
const STICK_TURN_SPEED=20;  // con la palanca de verdad sigue casi al instante

const moves=[]; let aimTarget=null;
function stickMove(dx,dy){
  if (state!=='play') return;

  let sx=0, sy=0; for (const m of moves){ sx+=m.dx; sy+=m.dy; }

let padSeenT=-1e9, padName='', stickPeak=0, pausedByApp=false;
function moveEvt(e){

if (window.PointerEvent){

// mando de consola (Bluetooth o USB)
const padPrev={};
function pollPad(dt){
  let pads=[];
  try { pads = navigator.getGamepads ? navigator.getGamepads() : []; } catch(e){}
  for (const gp of pads){
    if (!gp) continue;
    padName = gp.id || 'mando';
    if (gp.buttons.some(b=>b&&b.pressed) || gp.axes.some(a=>Math.abs(a)>0.3)) padSeenT=now();
    const btn = i => !!(gp.buttons[i] && gp.buttons[i].pressed);
    const press = i => { const p=btn(i), was=padPrev[gp.index+':'+i]; padPrev[gp.index+':'+i]=p; return p && !was; };
    if (state==='name'){
      if (press(14)) kbMove(-1,0); if (press(15)) kbMove(1,0); if (press(12)) kbMove(0,-1); if (press(13)) kbMove(0,1);
      if (press(0)) kbPress();
      continue;
    }
    const menu = state==='title' || state==='win' || state==='lose';
    const ax0=gp.axes[0]||0, stickL=ax0<-0.6, stickR=ax0>0.6;
    const sl=stickL && !padPrev[gp.index+':sl'], sr=stickR && !padPrev[gp.index+':sr'];
    padPrev[gp.index+':sl']=stickL; padPrev[gp.index+':sr']=stickR;
    const pl=press(14), pr=press(15);
    if (menu && (pl||sl)) setDiff(diff-1);
    if (menu && (pr||sr)) setDiff(diff+1);
    if (press(0) || press(1)) confirm();                                      // A / B
    if (press(9)){ if (state==='play') state='pause'; else confirm(); }       // Start
    if (press(2) || press(3) || press(4) || press(5) || press(12) || press(13)) swap(); // X / Y / gatillos / cruceta arriba-abajo
    if (state!=='play') continue;
    // palanca izquierda: apunta directamente hacia donde se empuja
    const ax=gp.axes[0]||0, ay=gp.axes[1]||0;
    if (Math.hypot(ax,ay) > 0.5) aimTarget=Math.atan2(ay,ax);
    // cruceta izquierda/derecha y palanca derecha: girar poco a poco
    const rx=gp.axes[2]||0;
    if (btn(14)) aim -= 1.4*dt;
    if (btn(15)) aim += 1.4*dt;
    if (Math.abs(rx)>0.3) aim += rx*1.8*dt;
  }
}
addEventListener('gamepadconnected', ()=>audio());

// ---------- juego ----------
function shoot(){
  if (shot) return;
  const ca=Math.cos(aim), sa=Math.sin(aim);
  shot={ x:SX+ca*100, y:SY+sa*100, vx:ca*1300, vy:sa*1300, color:cur, rot:0 };
  cur=nxt; nxt=pickColor();
  recoil=1;
  sfx.shoot();
}
function contact(i){ return i>0 && balls[i].s - balls[i-1].s <= D+1.5; }
function checkMatch(i){
  if (i<0 || i>=balls.length) return false;
  const c=balls[i].color;
  let a=i, b=i;
  while (a>0 && contact(a) && balls[a-1].color===c) a--;
  while (b<balls.length-1 && contact(b+1) && balls[b+1].color===c) b++;
  const n=b-a+1;
  if (n<3) return false;
  let mx=0, my=0;
  for (let j=a;j<=b;j++){
    const p=ballXY(balls[j]); mx+=p.x; my+=p.y;
    rings.push({ x:p.x, y:p.y, t:0, color:COLORS[c].l });
    for (let q=0;q<9;q++){
      const ang=Math.random()*Math.PI*2, sp=90+Math.random()*260;
      particles.push({ x:p.x, y:p.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:0.8, max:0.8,
        color: q%3===0 ? '#ffffff' : COLORS[c].c, r:5+Math.random()*7, star: q%3===0 });
    }
  }
  const pts=n*10*combo;
  score+=pts; levelScore+=pts; save('cdc_score',score);
  texts.push({ x:mx/n, y:my/n, t:1.4, s: combo>1 ? '+'+pts+'  ¡x'+combo+'!' : '+'+pts, big: combo>1 });
  sfx.pop(combo);
  shake=Math.min(10, 3+combo*2);
  combo++;
  const powers=[]; for (let j=a;j<=b;j++) if (balls[j].power) powers.push(balls[j].power);
  const centerS=(balls[a].s+balls[b].s)/2;
  balls.splice(a, n);
  if (a<balls.length) balls[a].gapBefore=true;
  for (const pw of powers) applyPower(pw, centerS);
  fixShooterColors();
  return true;
}
function applyPower(pw, centerS){
  if (pw==='slow'){ slowT=9; showBanner('¡Cámara lenta!', '#8fd3ff'); tone(300,0.6,'sine',0.12,150); }
  else if (pw==='back'){ backT=3.5; showBanner('¡Marcha atrás!', '#b6ff8a'); tone(500,0.5,'triangle',0.12,250); }
  else if (pw==='bomb'){
    showBanner('¡Bum!', '#ff7a5c'); shake=16; tone(90,0.5,'sawtooth',0.18,40);
    let first=-1, cnt=0;
    for (let i=balls.length-1;i>=0;i--){
      if (Math.abs(balls[i].s-centerS) < D*4.2 && balls[i].s>=0){
        const p=ballXY(balls[i]);
        for (let q=0;q<6;q++){ const ang=Math.random()*6.28, sp=120+Math.random()*300;
          particles.push({ x:p.x, y:p.y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, life:0.8, max:0.8, color: q%2?'#ffb300':'#ff5722', r:6+Math.random()*8 }); }
        rings.push({ x:p.x, y:p.y, t:0, color:'#ffcf6b' });
        const extra=balls[i].power; balls.splice(i,1); first=i; cnt++;
        if (extra && extra!=='bomb') applyPower(extra, centerS);
      }
    }
    if (cnt){ const pts=cnt*10; score+=pts; levelScore+=pts; save('cdc_score',score); }
    if (first>=0 && first<balls.length) balls[first].gapBefore=true;
  }
}
function ballXY(b){
  const p=pathPos(path,b.s);
  if (b.ft>0){ const k=b.ft/0.15; return { x:p.x+(b.fx-p.x)*k, y:p.y+(b.fy-p.y)*k }; }
  return p;
}
function insertShot(idx){
  const hit=balls[idx], hp=pathPos(path,hit.s), ahead=pathPos(path,hit.s+4);
  const tx=ahead.x-hp.x, ty=ahead.y-hp.y;
  const after = (shot.x-hp.x)*tx + (shot.y-hp.y)*ty > 0;
  const k = after ? idx+1 : idx;
  const nb={ s: after ? hit.s+D : hit.s, color:shot.color, fx:shot.x, fy:shot.y, ft:0.15, gapBefore:false };
  balls.splice(k,0,nb);
  for (let j=k+1;j<balls.length;j++){
    if (balls[j].s < balls[j-1].s + D){ balls[j].s = balls[j-1].s + D; } else break;
  }
  shot=null;
  combo=1;
  if (!checkMatch(k)){ combo=1; sfx.hit(); }
}
function rayHit(maxLen){
  const ca=Math.cos(aim), sa=Math.sin(aim);
  const vis=[];
  for (const b of balls){ if (b.s>=0) vis.push(pathPos(path,b.s)); }
  const lim=(D*0.85)*(D*0.85);
  // distancia hasta el borde de la pantalla
  let best=maxLen;
  if (ca>1e-6) best=Math.min(best,(W+30-SX)/ca); if (ca<-1e-6) best=Math.min(best,(-30-SX)/ca);
  if (sa>1e-6) best=Math.min(best,(H+30-SY)/sa); if (sa<-1e-6) best=Math.min(best,(-30-SY)/sa);
  // primera bola que toca la línea
  for (const p of vis){
    const dx=p.x-SX, dy=p.y-SY, t=dx*ca+dy*sa;
    if (t<100) continue;
    const perp=dx*dx+dy*dy-t*t;
    if (perp<lim){ const hit=t-Math.sqrt(lim-perp); if (hit<best) best=Math.max(100,hit); }
  }
  return best;
}

// velocidad de la fila: entra rápido, frena, y luego acelera poco a poco
function speedMult(){ return Math.min(MAX_MULT, 1 + Math.floor(playT/DIFFS[diff].every)*0.01); }
function targetSpeed(front){
  if (rolling) return 220;
  const mult=speedMult();
  let v = info.speed * mult;
  const step=Math.floor((mult-1)*4);   // aviso cada +25 %
  if (step>speedStep){ speedStep=step; showBanner('¡Más rápido!', '#ffb15c'); }
  if (front > path.L*0.8) v*=DIFFS[diff].nearHole;   // cerca del agujero, más despacio (menos en difícil)
  if (slowT>0) v*=0.35;
  return v;
}

function update(dt){
  stateT+=dt;
  pollPad(dt);
  for (const p of particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.93; p.vy*=0.93; p.vy+=60*dt; p.life-=dt; }
  particles=particles.filter(p=>p.life>0);
  for (const r of rings) r.t+=dt;
  rings=rings.filter(r=>r.t<0.45);
  for (const t of texts){ t.t-=dt; t.y-=45*dt; }
  texts=texts.filter(t=>t.t>0);
  shake=Math.max(0, shake-dt*30);
  swapAnim=Math.max(0, swapAnim-dt*5);
  if (banner){ banner.t-=dt; if (banner.t<=0) banner=null; }
  recoil=Math.max(0, recoil-dt*6);
  bubbleStep(dt);

  if (state==='bonus'){ updateBonus(dt); return; }
  if (state==='losing'){
    for (const b of balls) b.s+=700*dt;
    balls=balls.filter(b=>b.s<path.L);
    if (!balls.length || stateT>2.5){ lives--; state = lives>0 ? 'lose' : 'gameover'; stateT=0; sfx.lose(); }
    return;
  }
  if (state!=='play') return;
  steerAim(dt);

  // apuntar con el mando (seguridad: si la tele no manda "soltar", paramos solos)
  for (const side of ['left','right']){
    if (held[side] && now()-lastKey[side] > 650) held[side]=false;
    if (held[side]){
      heldT[side]+=dt;
      const sp = heldT[side]<0.15 ? 0 : heldT[side]<0.7 ? 1.1 : 2.4;
      aim += (side==='left'?-1:1)*sp*dt;
    }
  }

  // disparo
  if (shot){
    const steps=4;
    shot.rot+=dt*12;
    for (let k=0;k<steps && shot;k++){
      shot.x+=shot.vx*dt/steps; shot.y+=shot.vy*dt/steps;
      if (shot.x<-60||shot.x>W+60||shot.y<-60||shot.y>H+60){ shot=null; break; }
      let best=-1, bd=1e9;
      for (let i=0;i<balls.length;i++){
        if (balls[i].s<0) continue;
        const p=pathPos(path,balls[i].s), d=Math.hypot(p.x-shot.x,p.y-shot.y);
        if (d<D*0.9 && d<bd){ bd=d; best=i; }
      }
      if (best>=0) insertShot(best);
    }
  }

  for (const b of balls) if (b.ft>0) b.ft=Math.max(0,b.ft-dt);

  // aparecen bolas nuevas por detrás
  while (queue.length && (!balls.length || balls[0].s >= 0)){
    const s = balls.length && balls[0].s < D ? balls[0].s - D : -D;
    balls.unshift({ s, color:queue.shift(), power:queuePow.shift(), ft:0, gapBefore: !(balls.length && balls[0].s < D) && balls.length>0 });
    if (balls.length>1) balls[1].gapBefore = balls[1].s - balls[0].s > D+1.5;
  }

  // los trozos sueltos ruedan hacia atrás hasta chocar con la fila de detrás.
  // Si en el hueco se tocan dos bolas del mismo color, el imán es más fuerte.
  for (let i=1;i<balls.length;i++){
    const h=balls[i];
    if (!h.gapBefore){ h.backV=0; continue; }
    const match = h.color===balls[i-1].color;
    const maxV = match ? 520 : 260, acc = match ? 900 : 380;
    h.backV = Math.min(maxV, (h.backV||0) + acc*dt);
    const mv = Math.min(h.backV*dt, h.s - balls[i-1].s - D + 0.5);
    let j=i;
    do { balls[j].s-=mv; j++; } while (j<balls.length && !balls[j].gapBefore);
  }

  // avanza la cola
  const front = balls.length ? balls[balls.length-1].s : 0;
  if (rolling && front > path.L*0.22) rolling=false;
  if (!rolling) playT+=dt;
  const tv=targetSpeed(front);
  chainV += (tv-chainV)*Math.min(1, dt*(rolling?8:1.5));
  slowT=Math.max(0,slowT-dt);
  if (backT>0){
    backT-=dt;
    let j=0; do { balls[j].s -= 75*dt; j++; } while (j<balls.length && !balls[j].gapBefore);
    chainV=0;
  } else if (balls.length) balls[0].s += chainV*dt;

  // empuja y detecta huecos que se cierran
  for (let i=1;i<balls.length;i++){
    if (balls[i].s < balls[i-1].s + D) balls[i].s = balls[i-1].s + D;
  }
  // todos los huecos que se han cerrado en este fotograma (también los que cierra un disparo al empujar la fila)
  const joins=[];
  for (let i=1;i<balls.length;i++) if (balls[i].gapBefore && contact(i)) joins.push(balls[i]);
  for (let i=0;i<balls.length;i++) balls[i].gapBefore = i>0 && balls[i].s - balls[i-1].s > D+1.5;
  for (const b of joins){
    const i=balls.indexOf(b);
    if (i<0) continue;    // ya explotó con otro choque
    const p=ballXY(b); rings.push({ x:p.x, y:p.y, t:0.2, color:'#ffffff' });
    if (!checkMatch(i)){ combo=1; tone(160,0.08,'triangle',0.12,110); shake=Math.max(shake,4); }
  }

  // ¿fin?
  if (balls.length && balls[balls.length-1].s >= path.L){ state='losing'; stateT=0; shot=null; return; }
  if (balls.length) lastFrontS=Math.max(0, balls[balls.length-1].s);
  if (!balls.length && !queue.length) startBonus();
}
function startBonus(){
  shot=null; state='bonus'; stateT=0;
  bonus={ s:lastFrontS, start:lastFrontS, pts:0, tick:0 };
  showBanner('¡Bonus!', '#ffe28a');
}
function updateBonus(dt){
  // la bola de luz recorre el camino libre hasta el agujero (unos 3 s si el camino está entero)
  const speed=Math.max(700, path.L/3);
  bonus.s=Math.min(path.L, bonus.s+speed*dt);
  const pts=Math.floor((bonus.s-bonus.start)/BONUS_PX);
  if (pts>bonus.pts){

// ---------- sprites de bolas (se dibujan una vez) ----------
const SPR = LOWPOWER ? 1 : 2;  // resolución extra para que se vean nítidas en TV grandes
function makeSprite(c, r){
  const C=COLORS[c], sz=Math.ceil((r+6)*2*SPR), cnv=document.createElement('canvas');
  cnv.width=cnv.height=sz; const g=cnv.getContext('2d'); g.scale(SPR,SPR);
  const o=r+6;
  // cuerpo
  const grad=g.createRadialGradient(o-r*0.3,o-r*0.35,r*0.1,o,o,r*1.05);
  grad.addColorStop(0,C.l); grad.addColorStop(0.45,C.c); grad.addColorStop(1,C.d);
  g.fillStyle=grad; g.beginPath(); g.arc(o,o,r,0,Math.PI*2); g.fill();
  // reflejo inferior
  const g2=g.createRadialGradient(o+r*0.25,o+r*0.55,1,o+r*0.25,o+r*0.55,r*0.7);
  g2.addColorStop(0,'rgba(255,255,255,0.28)'); g2.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=g2; g.beginPath(); g.arc(o,o,r,0,Math.PI*2); g.fill();

function makeShine(r){
  const sz=Math.ceil((r+6)*2*SPR), cnv=document.createElement('canvas');

  const gr=g.createRadialGradient(0,0,0,0,0,r*0.42);
  gr.addColorStop(0,'rgba(255,255,255,0.95)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.scale(1,0.6); g.beginPath(); g.arc(0,0,r*0.42,0,Math.PI*2); g.fill();

}
const sprites={}, shines={};
function sprite(c,r){ const k=c+':'+r; return sprites[k] || (sprites[k]=makeSprite(c,r)); }
function shine(r){ return shines[r] || (shines[r]=makeShine(r)); }

// ---------- dibujo ----------
function drawSym(sym, x, y, r, col){
  ctx.fillStyle=col; ctx.beginPath();
  if (sym==='circle'){ ctx.arc(x,y,r*0.36,0,Math.PI*2); ctx.moveTo(x+r*0.16,y); ctx.arc(x,y,r*0.16,0,Math.PI*2,true); }
  else if (sym==='square'){ const a=r*0.34; ctx.rect(x-a,y-a,a*2,a*2); }
  else if (sym==='diamond'){ const a=r*0.5; ctx.moveTo(x,y-a); ctx.lineTo(x+a*0.8,y); ctx.lineTo(x,y+a); ctx.lineTo(x-a*0.8,y); ctx.closePath(); }
  else if (sym==='triangle'){ const a=r*0.48; ctx.moveTo(x,y-a); ctx.lineTo(x+a*0.95,y+a*0.7); ctx.lineTo(x-a*0.95,y+a*0.7); ctx.closePath(); }
  else if (sym==='star'){ for (let i=0;i<10;i++){ const rr = i%2 ? r*0.22 : r*0.52, a=-Math.PI/2+i*Math.PI/5; const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr; i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); }
  ctx.fill('evenodd');
}
// en la tele cada bola es una sola imagen ya preparada (sombra + bola + dibujo + brillo)
const fullSprites={};
function fullSprite(c,r){
  const k=c+':'+r; if (fullSprites[k]) return fullSprites[k];
  const C=COLORS[c], sp=sprite(c,r), sh=shine(r), pad=r+12, sz=Math.ceil(pad*2*SPR);
  const cnv=document.createElement('canvas'); cnv.width=cnv.height=sz;
  const g=cnv.getContext('2d'); g.scale(SPR,SPR);
  g.fillStyle='rgba(0,0,0,0.38)'; g.beginPath(); g.ellipse(pad+r*0.3,pad+r*0.62,r*0.9,r*0.42,0,0,Math.PI*2); g.fill();
  g.drawImage(sp.cnv, pad-sp.o, pad-sp.o, sp.sz/SPR, sp.sz/SPR);
  const saved=ctx; ctx=g;   // drawSym dibuja en ctx
  drawSym(C.sym, pad+1.2, pad+2.4, r, 'rgba(0,0,0,0.35)'); drawSym(C.sym, pad, pad+1, r, C.sc);
  ctx=saved;
  g.drawImage(sh.cnv, pad-sh.o, pad-sh.o, sh.sz/SPR, sh.sz/SPR);
  return (fullSprites[k]={ cnv, pad, sz });
}
function drawBall(x, y, c, r, rot, power){
  r=r||R;
  if (LOWPOWER && !power){ const f=fullSprite(c,r); ctx.drawImage(f.cnv, x-f.pad, y-f.pad, f.sz/SPR, f.sz/SPR); return; }
  const C=COLORS[c], sp=sprite(c,r), sh=shine(r);
  ctx.fillStyle='rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(x+r*0.3,y+r*0.62,r*0.9,r*0.42,0,0,Math.PI*2); ctx.fill();
  ctx.drawImage(sp.cnv, x-sp.o, y-sp.o, sp.sz/SPR, sp.sz/SPR);
  ctx.save(); ctx.translate(x,y); if (rot) ctx.rotate(rot);
  if (power){ ctx.restore(); drawPower(x,y,r,power); return; }
  drawSym(C.sym, 1.2, 2.4, r, 'rgba(0,0,0,0.35)'); drawSym(C.sym, 0, 1, r, C.sc);
  ctx.restore();
  ctx.drawImage(sh.cnv, x-sh.o, y-sh.o, sh.sz/SPR, sh.sz/SPR);

function drawPower(x,y,r,pw){
  const t=performance.now()/1000, pulse=0.5+0.5*Math.sin(t*6);
  ctx.strokeStyle=`rgba(255,240,120,${0.55+0.45*pulse})`; ctx.lineWidth=4+pulse*2;
  ctx.beginPath(); ctx.arc(x,y,r+3+pulse*3,0,Math.PI*2); ctx.stroke();
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.beginPath(); ctx.arc(x,y,r*0.55,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.fillStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round';
  const k=r*0.42;
  if (pw==='bomb'){
    ctx.beginPath(); ctx.arc(x-2,y+3,k*0.85,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+k*0.4,y-k*0.4); ctx.quadraticCurveTo(x+k*0.9,y-k*1.1,x+k*1.1,y-k*0.8); ctx.stroke();
    ctx.fillStyle= pulse>0.5 ? '#ffd23f' : '#ff7043'; ctx.beginPath(); ctx.arc(x+k*1.1,y-k*0.85,4,0,Math.PI*2); ctx.fill();

    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-k*0.7); ctx.moveTo(x,y); ctx.lineTo(x+k*0.5,y+k*0.2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(x,y,k*0.8,-0.3,Math.PI*1.35); ctx.stroke();
    const ax=x+Math.cos(-0.3)*k*0.8, ay=y+Math.sin(-0.3)*k*0.8;
    ctx.beginPath(); ctx.moveTo(ax+6,ay-1); ctx.lineTo(ax-2,ay-7); ctx.lineTo(ax-3,ay+4); ctx.closePath(); ctx.fill();

}
function strokePath(g, pts, w, col, dx, dy){
  g.strokeStyle=col; g.lineWidth=w; g.beginPath();
  for (let i=0;i<pts.length;i+=3) i?g.lineTo(pts[i][0]+(dx||0),pts[i][1]+(dy||0)):g.moveTo(pts[i][0]+(dx||0),pts[i][1]+(dy||0));
  g.lineTo(pts[pts.length-1][0]+(dx||0),pts[pts.length-1][1]+(dy||0));
  g.stroke();
}
function renderBackground(p){

    if (y>H-90 && (x<480 || x>W-340)) return false;
    for (let cy=((y-rad)/CELL)|0; cy<=((y+rad)/CELL)|0; cy++) for (let cx=((x-rad)/CELL)|0; cx<=((x+rad)/CELL)|0; cx++) if (busy[cy*cols+cx]) return false;

      const a=pts[i-3], b=pts[i+3], tx=b[0]-a[0], ty=b[1]-a[1], l=Math.hypot(tx,ty)||1, nx=-ty/l, ny=tx/l;
      for (const sd of [-1,1]){ g.beginPath(); g.moveTo(pts[i][0]+nx*sd*(D/2+3), pts[i][1]+ny*sd*(D/2+3)); g.lineTo(pts[i][0]+nx*sd*(D/2+13), pts[i][1]+ny*sd*(D/2+13)); g.stroke(); }
    }
    // canal hundido
    strokePath(g,pts,D+6,'#2b1d10');                  // sombra interior (profundidad)
    strokePath(g,pts,D,'#a07c48',2,4);
    strokePath(g,pts,D-10,'#c29a5e',3,5);
    strokePath(g,pts,D-26,'#cfa86b',3,6);
    for (let i=0;i<pts.length;i+=7){
      const a=rnd()*Math.PI*2, rr=rnd()*(D/2-8);
      g.fillStyle= rnd()<0.5 ? 'rgba(90,60,25,0.28)' : 'rgba(255,240,200,0.25)';

    }
  }

    const kind = rnd(), x=rnd()*W, y=rnd()*H;

  }
  items.sort((a,b)=>a.y-b.y);

  g.fillStyle='rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(SX+6,SY+16,104,96,0,0,Math.PI*2); g.fill();
  g.fillStyle='#4a4338'; g.beginPath(); g.arc(SX,SY+8,100,0,Math.PI*2); g.fill();
  const pg=g.createRadialGradient(SX-35,SY-40,10,SX,SY,100);
  pg.addColorStop(0,'#e2d8c2'); pg.addColorStop(0.6,'#a59a83'); pg.addColorStop(1,'#6f6553');
  g.fillStyle=pg; g.beginPath(); g.arc(SX,SY,98,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(60,50,38,0.5)'; g.lineWidth=2;
  g.beginPath(); g.arc(SX,SY,78,0,Math.PI*2); g.stroke();
  for (let i=0;i<12;i++){ const a=i*Math.PI/6; g.beginPath(); g.moveTo(SX+Math.cos(a)*78,SY+Math.sin(a)*78); g.lineTo(SX+Math.cos(a)*97,SY+Math.sin(a)*97); g.stroke(); }
  // --- hojas grandes en las esquinas de arriba ---
  for (const [cx,cy,base] of [[0,0,0.2],[W,0,Math.PI-0.2]]){
    for (let i=0;i<6;i++){

  g.fillStyle=sun; g.fillRect(0,0,W,H);

  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,10,0,0.55)');

}
function drawLeaf(g,x,y,a,len,wid,col){

}
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function drawBubbles(){
  for (const b of bubbles){ const a=0.25+0.25*Math.sin(b.w*3); ctx.fillStyle=`rgba(255,250,190,${a})`; ctx.beginPath(); ctx.arc(b.x+Math.sin(b.w)*14,b.y,b.r*0.35,0,Math.PI*2); ctx.fill(); }
}
function drawHole(){
  const e=pathPos(path,path.L);
  const front = balls.length ? balls[balls.length-1].s : 0;
  const danger = (state==='play' || state==='losing') && front > path.L*0.8;
  const t=performance.now()/1000;
  const pulse = danger ? 0.5+0.5*Math.sin(t*7) : 0.5+0.5*Math.sin(t*2);
  const glow=ctx.createRadialGradient(e.x,e.y,R,e.x,e.y,R+40);
  glow.addColorStop(0, danger ? `rgba(255,70,40,${0.5+0.4*pulse})` : `rgba(255,215,100,${0.25+0.15*pulse})`);
  glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.arc(e.x,e.y,R+40,0,Math.PI*2); ctx.fill();
  const g=ctx.createRadialGradient(e.x,e.y,2,e.x,e.y,R+10);
  g.addColorStop(0,'#000'); g.addColorStop(0.7,'#0a1a24'); g.addColorStop(1,'#1e3c48');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(e.x,e.y,R+10,0,Math.PI*2); ctx.fill();
  // remolino
  ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(t*2.2);
  ctx.strokeStyle='rgba(140,220,255,0.35)'; ctx.lineWidth=3;
  for (let k=0;k<3;k++){ ctx.rotate(Math.PI*2/3); ctx.beginPath(); ctx.arc(8,0,R-6,-0.4,1.6); ctx.stroke(); }
  ctx.restore();
  ctx.strokeStyle= danger ? '#ff6a4a' : '#f4cf63'; ctx.lineWidth=6; ctx.beginPath(); ctx.arc(e.x,e.y,R+10,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(e.x,e.y,R+14,Math.PI*1.1,Math.PI*1.6); ctx.stroke();
}
function drawShooter(){
  // línea de ayuda
  const len=rayHit(1800), ca=Math.cos(aim), sa=Math.sin(aim);
  const t=performance.now()/1000, off=(t*60)%26;
  ctx.fillStyle=COLORS[cur].l;
  for (let d=130+off; d<len; d+=26){ ctx.globalAlpha=0.9*Math.min(1,(len-d)/60+0.3); ctx.beginPath(); ctx.arc(SX+ca*d, SY+sa*d, 5, 0, Math.PI*2); ctx.fill(); }
  ctx.globalAlpha=1;
  const bob=Math.sin(t*2.5)*1.5, rc=recoil*10;
  ctx.save(); ctx.translate(SX,SY+bob); ctx.rotate(aim);
  ctx.translate(-rc,0);
  // patitas
  for (const a of [0.85,-0.85,2.35,-2.35]){
    ctx.fillStyle='#4f9e44'; ctx.beginPath(); ctx.ellipse(Math.cos(a)*54,Math.sin(a)*54,22,14,a,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#7fd06a'; ctx.beginPath(); ctx.ellipse(Math.cos(a)*54,Math.sin(a)*54,17,10,a,0,Math.PI*2); ctx.fill();
  }
  // cola
  ctx.fillStyle='#6cc25a'; ctx.beginPath(); ctx.moveTo(-50,-9); ctx.lineTo(-76,0); ctx.lineTo(-50,9); ctx.closePath(); ctx.fill();
  // cabeza
  const hg=ctx.createRadialGradient(58,-8,4,64,0,32);
  hg.addColorStop(0,'#b6f08f'); hg.addColorStop(1,'#5aae48');
  ctx.fillStyle=hg; ctx.beginPath(); ctx.ellipse(66,0,32,29,0,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#2d6b2a'; ctx.lineWidth=3; ctx.stroke();
  for (const s of [-1,1]){
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(74,s*13,9,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#14202a'; ctx.beginPath(); ctx.arc(77,s*13,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(78.5,s*13-2,1.8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,120,140,0.45)'; ctx.beginPath(); ctx.arc(64,s*21,5,0,Math.PI*2); ctx.fill();
  }
  // caparazón
  const g=ctx.createRadialGradient(-14,-14,6,0,0,62);
  g.addColorStop(0,'#e7b866'); g.addColorStop(0.6,'#b07a32'); g.addColorStop(1,'#6e4718');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,58,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#4a3010'; ctx.lineWidth=4; ctx.stroke();
  ctx.strokeStyle='rgba(74,48,16,0.55)'; ctx.lineWidth=3;
  for (let i=0;i<6;i++){ const a=i*Math.PI/3; ctx.beginPath(); ctx.moveTo(Math.cos(a)*30,Math.sin(a)*30); ctx.lineTo(Math.cos(a)*56,Math.sin(a)*56); ctx.stroke(); }
  ctx.beginPath(); for (let i=0;i<6;i++){ const a=i*Math.PI/3; i?ctx.lineTo(Math.cos(a)*30,Math.sin(a)*30):ctx.moveTo(Math.cos(a)*30,Math.sin(a)*30); } ctx.closePath(); ctx.stroke();
  ctx.restore();
  // bola siguiente en el caparazón
  const ns = 17 + swapAnim*6;
  ctx.fillStyle='rgba(40,25,5,0.45)'; ctx.beginPath(); ctx.arc(SX,SY+bob,25,0,Math.PI*2); ctx.fill();
  drawBall(SX,SY+bob,nxt,Math.round(ns));
  // bola actual en la boca
  const md=106-rc;
  drawBall(SX+ca*md, SY+bob+sa*md, cur, R);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function pill(x,y,w,h){
  ctx.fillStyle='rgba(2,14,20,0.62)'; roundRect(x,y,w,h,h/2); ctx.fill();
  ctx.strokeStyle='rgba(255,226,138,0.35)'; ctx.lineWidth=2; ctx.stroke();
}
function hud(){
  ctx.font='bold 32px '+FONT; ctx.textBaseline='middle';
  const y=H-36, txt=DIFFS[diff].name+' · Nivel '+level+(queue.length ? '   ·   Faltan '+queue.length : '');
  const w=ctx.measureText(txt).width+48;
  const bw=150;
  pill(12,y-27,w+bw,54); pill(W-312,y-27,300,54);
  ctx.fillStyle='#fff'; ctx.textAlign='left'; ctx.fillText(txt, 36, y);
  // velocímetro: 5 barritas
  const lvl = info && !rolling ? Math.min(1, (speedMult()-1)/(MAX_MULT-1)) : 0, nb=1+Math.round(Math.max(0,lvl)*4);
  for (let i=0;i<5;i++){
    const bx=12+w+8+i*24, bh=12+i*6;
    ctx.fillStyle = i<nb ? (backT>0 ? '#b6ff8a' : slowT>0 ? '#8fd3ff' : ['#7fe08a','#c6e86a','#ffd54f','#ffa040','#ff5a3c'][i]) : 'rgba(255,255,255,0.18)';
    roundRect(bx, y+16-bh, 16, bh, 4); ctx.fill();
  }
  ctx.textAlign='right'; ctx.fillStyle='#ffe28a'; ctx.fillText('Puntos '+score, W-36, y);
}
function shadowText(s,x,y,col,stroke){
  ctx.lineJoin='round'; ctx.lineWidth=stroke||8; ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.strokeText(s,x,y);
  ctx.fillStyle=col; ctx.fillText(s,x,y);
}
function panel(title, lines, foot, showDiff){
  ctx.fillStyle='rgba(2,12,18,0.3)'; ctx.fillRect(0,0,W,H);
  const pw=1240, ph=120+lines.length*72+(foot?150:40)+(showDiff?150:0), px=(W-pw)/2, py=(H-ph)/2;
  ctx.fillStyle='rgba(0,0,0,0.35)'; roundRect(px+6,py+12,pw,ph,36); ctx.fill();
  const g=ctx.createLinearGradient(0,py,0,py+ph);
  g.addColorStop(0,'rgba(18,78,92,0.96)'); g.addColorStop(1,'rgba(6,36,48,0.96)');
  ctx.fillStyle=g; roundRect(px,py,pw,ph,36); ctx.fill();
  ctx.strokeStyle='#f4cf63'; ctx.lineWidth=4; ctx.stroke();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 84px '+FONT; shadowText(title, W/2, py+80, '#ffe28a', 10);
  ctx.font='bold 40px '+FONT; ctx.fillStyle='#fff';
  lines.forEach((l,i)=>ctx.fillText(l, W/2, py+170+i*72));
  if (showDiff){
    const y0=py+ph-(foot?150:40)-105, bw=250, gap=30, x0=W/2-(bw*3+gap*2)/2;
    ctx.font='bold 30px '+FONT; ctx.fillStyle='#cfe9ee';
    ctx.fillText(usedTouch ? 'Dificultad (toca para elegir)' : 'Dificultad  ◀ ▶', W/2, y0-8);
    diffBoxes=[];
    DIFFS.forEach((d,i)=>{
      const x=x0+i*(bw+gap), y=y0+14, h=64, sel=i===diff;
      diffBoxes.push({x,y,w:bw,h,d:i});
      ctx.fillStyle = sel ? d.col : 'rgba(255,255,255,0.10)'; roundRect(x,y,bw,h,32); ctx.fill();
      ctx.lineWidth = sel ? 5 : 2; ctx.strokeStyle = sel ? '#ffffff' : 'rgba(255,255,255,0.35)'; ctx.stroke();
      ctx.font='bold 38px '+FONT; ctx.fillStyle = sel ? '#10262e' : '#ffffff'; ctx.fillText(d.name, x+bw/2, y+h/2+2);
    });
  }
  if (foot){
    const a=0.65+0.35*Math.sin(performance.now()/300);
    const by=py+ph-80, bw=Math.min(pw-80, 60+foot.length*26);
    ctx.globalAlpha=a; ctx.fillStyle='#2fae5a'; roundRect(W/2-bw/2,by-38,bw,76,38); ctx.fill();
    ctx.globalAlpha=1; ctx.font='bold 42px '+FONT; ctx.fillStyle='#fff'; ctx.fillText(foot, W/2, by+2);
  }
}
function okWord(){ return usedTouch ? 'Toca la pantalla' : 'Pulsa OK'; }
function drawTitle(){
  drawBubbles();
  const t=performance.now()/1000;
  for (let i=0;i<22;i++){
    const u=(t*0.05+i/22)%1, a=u*Math.PI*2;
    const x=SX+Math.cos(a)*690, y=SY+Math.sin(a)*380;
    drawBall(x,y,i%5,30,a*4);
  }
  const lines = usedTouch ? [
      'Junta 3 bolas del mismo color para que exploten.',
      'Las bolas con anillo dorado traen una sorpresa.',
      'Toca donde quieras disparar.',
      'Puedes arrastrar el dedo para apuntar mejor.',
      'Toca la tortuga para cambiar de bola.',
    ] : [
      'Junta 3 bolas del mismo color para que exploten.',
      'Las bolas con anillo dorado traen una sorpresa.',
      '◀ ▶  apuntar      ▲ ▼  cambiar de bola      OK  disparar',
      IN_APP ? 'Palanca apunta · A dispara · B cambia de bola · ≡ pausa · ⧉ salir' : dirMode ? 'Mando: la tortuga mira al cursor · A dispara · mantén A para cambiar' : 'Mando de consola: palanca para apuntar, A para disparar',
      'En el iPad: toca para disparar, toca la tortuga para cambiar',
    ];
  panel('Collar de Colores', lines, level>1 ? okWord()+' para seguir en el nivel '+level : okWord()+' para empezar', true);
  // botón para ver el ranking (▲▼ en el mando, o tocarlo)
  rankBtn={ x:W-330, y:18, w:310, h:62 };
  ctx.fillStyle='rgba(2,14,20,0.75)'; roundRect(rankBtn.x,rankBtn.y,rankBtn.w,rankBtn.h,31); ctx.fill();
  ctx.strokeStyle='#f4cf63'; ctx.lineWidth=3; ctx.stroke();
  ctx.font='bold 32px '+FONT; ctx.fillStyle='#ffe28a'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(usedTouch ? 'Ver ranking' : '▼  Ver ranking', rankBtn.x+rankBtn.w/2, rankBtn.y+rankBtn.h/2+2);
}
let _titleBg=null;
function titleBg(){ return _titleBg || (_titleBg=renderBackground(null)); }
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const want = (state==='title' || (state==='ranking' && (rankFromTitle || !path))) ? titleBg() : bgCanvas;
  if (want && want!==bgShown){
    bctx.setTransform(1,0,0,1,0,0); bctx.fillStyle='#04161f'; bctx.fillRect(0,0,bgcv.width,bgcv.height);
    bctx.setTransform(scale*dpr,0,0,scale*dpr,offX*dpr,offY*dpr); bctx.drawImage(want,0,0,W,H);
    bgShown=want;
  }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const sx = shake ? (Math.random()-0.5)*shake : 0, sy = shake ? (Math.random()-0.5)*shake : 0;
  ctx.setTransform(scale*dpr,0,0,scale*dpr,(offX+sx*scale)*dpr,(offY+sy*scale)*dpr);
  ctx.save(); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  if (state==='title'){ drawTitle(); ctx.restore(); portraitHint(); return; }
  if (state==='ranking' && (rankFromTitle || !path)){ drawBubbles(); drawRanking(); ctx.restore(); return; }
  drawBubbles();
  drawHole();
  for (const b of balls){ if (b.s<0) continue; const p=ballXY(b); drawBall(p.x,p.y,b.color,R,b.s/R,b.power); }
  if (shot) drawBall(shot.x, shot.y, shot.color, R, shot.rot);
  for (const r of rings){
    const k=r.t/0.45; ctx.globalAlpha=1-k; ctx.strokeStyle=r.color; ctx.lineWidth=6*(1-k)+1;
    ctx.beginPath(); ctx.arc(r.x,r.y,R*(0.6+k*1.4),0,Math.PI*2); ctx.stroke();
  }
  for (const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.color;
    if (p.star){ drawSym('star', p.x, p.y, p.r*2, p.color); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(0.4+0.6*p.life/p.max),0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha=1;
  drawShooter();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for (const t of texts){
    const k=Math.min(1,(1.4-t.t)*6), sc=t.big ? 0.6+0.5*k : 0.7+0.3*k;
    ctx.globalAlpha=Math.min(1,t.t*1.5);
    ctx.font='bold '+Math.round((t.big?58:46)*sc)+'px '+FONT;
    shadowText(t.s,t.x,t.y, t.big ? '#ff9de0' : '#fff36b', 7);
  }
  ctx.globalAlpha=1;
  if (banner && state==='play'){
    const a=Math.min(1,banner.t*2), sc=1+Math.max(0,banner.t-1.9)*1.5;
    ctx.globalAlpha=a; ctx.font='bold '+Math.round(64*sc)+'px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
    shadowText(banner.text, SX, 300, banner.color, 10); ctx.globalAlpha=1;
  }
  if (bonus){
    const p=pathPos(path,bonus.s), t=performance.now()/1000;
    const g=ctx.createRadialGradient(p.x,p.y,2,p.x,p.y,R+18);
    g.addColorStop(0,'#ffffff'); g.addColorStop(0.45,'#fff59d'); g.addColorStop(1,'rgba(255,220,90,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,R+18+3*Math.sin(t*20),0,Math.PI*2); ctx.fill();
    ctx.font='bold 72px '+FONT; ctx.textAlign='center'; ctx.textBaseline='middle';
    shadowText('Bonus +'+bonus.pts, SX, 210, '#ffe28a', 10);
  }
  hud();
  if (state==='win') panel('¡Muy bien!', ['Has terminado el nivel '+level+'.', 'Bonus del camino: +'+lastBonus, 'Puntos de este nivel: '+levelScore], okWord()+' para el nivel '+(level+1), true);
  if (state==='lose') panel('¡Casi!', ['Las bolas llegaron al agujero.', lives===1 ? 'Te queda 1 vida.' : 'Te quedan '+lives+' vidas.'], okWord()+' para intentarlo otra vez', true);
  if (state==='gameover') panel('Fin de la partida', ['Has llegado al nivel '+level+'.', 'Puntos: '+fmt(score)], okWord()+(qualifies(score)?' para apuntar tu nombre':' para ver el ranking'));
  if (state==='name') drawNameEntry();
  if (state==='ranking') drawRanking();
  if (state==='pause') panel('Pausa', ['El juego está parado.'], okWord()+' para seguir');
  if (LOWPOWER){
    ctx.font='bold 22px '+FONT; ctx.textAlign='left'; ctx.fillStyle='rgba(255,255,255,0.75)';
    const pad = IN_APP ? 'app' : padName ? 'mando detectado ✓' : 'mando NO detectado (la tele lo usa como cursor)';
    ctx.fillText(Math.round(fpsAvg)+' fps  ·  '+pad, 14, 22);
  }
  ctx.restore();
  portraitHint();
}
function portraitHint(){
  if (innerHeight <= innerWidth*1.05) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const y=offY+H*scale+Math.min(80, offY/2);
  ctx.fillStyle='#ffe28a'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold '+Math.round(Math.max(18, innerWidth/26))+'px '+FONT;
  ctx.fillText('Gira el iPad para verlo más grande ⟳', innerWidth/2, y);
}

let last=performance.now();
let fpsAvg=60;
function frame(t){
  const raw=(t-last)/1000, dt=Math.min(0.05,raw); last=t;
  if (raw>0) fpsAvg=fpsAvg*0.95+(1/raw)*0.05;
  if (state!=='pause') update(dt);
  else pollPad(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
// para pruebas
window.__game = { get shot(){return !!shot;}, get aim(){return aim;}, get state(){return state;}, get balls(){return balls;}, get queue(){return queue;}, get score(){return score;}, set score(v){score=v;}, setAim(a){aim=a;}, get cur(){return cur;}, pos(i){ return ballXY(balls[i]); }, view(){ return {scale,offX,offY}; }, get speed(){ return chainV; }, set playT(v){ playT=v; } };
})();
</script>
